<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartPeak — Projecten</title>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
  <script src="assets/js/csv.js"></script>
  <script src="assets/js/firebase-init.js"></script>
  <style>
    :root {
      --primary: #2c7be5;
      --primary-dark: #1a5fba;
      --success: #00b478;
      --warning: #f6a623;
      --danger: #e54545;
      --bg: #f0f4fb;
      --card: #ffffff;
      --border: #dce3f0;
      --text: #1e2a3a;
      --muted: #6b7a99;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 16px;
    }
    h1 { font-size: 1.7rem; font-weight: 700; color: var(--primary-dark); margin-bottom: 4px; }
    h2 { font-size: 1.2rem; font-weight: 600; color: var(--primary-dark); margin-bottom: 12px; }
    .subtitle { color: var(--muted); font-size: 0.95rem; margin-bottom: 16px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(44, 123, 229, 0.06);
    }
    .center-card {
      max-width: 480px;
      margin: 80px auto;
      text-align: center;
    }
    .btn {
      display: inline-block;
      padding: 10px 20px;
      border-radius: 8px;
      border: 0;
      background: var(--primary);
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }
    .btn:hover { background: var(--primary-dark); }
    .btn-secondary { background: transparent; color: var(--primary); border: 1px solid var(--primary); }
    .btn-secondary:hover { background: #eef4ff; }
    .btn-danger { background: var(--danger); }
    .btn-danger:hover { background: #b02a2a; }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }
    .topbar .right { display: flex; align-items: center; gap: 12px; color: var(--muted); }

    .toolbar { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }

    .alert {
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 0.92rem;
      margin-bottom: 16px;
    }
    .alert-warning { background: #fff8ec; border: 1px solid #f6a623; color: #7a5000; }
    .alert-info    { background: #eef4ff; border: 1px solid #2c7be5; color: #1a3a6e; }
    .alert-error   { background: #fde8e8; border: 1px solid #e54545; color: #7a1010; }

    .hide { display: none !important; }

    table.project-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.92rem;
    }
    table.project-table th,
    table.project-table td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: middle;
    }
    table.project-table thead th {
      background: var(--bg);
      color: var(--muted);
      font-weight: 600;
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    table.project-table tr:last-child td { border-bottom: none; }
    table.project-table tr.deleted-row { opacity: 0.5; }

    .status-chip {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 0.82rem;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    .status-chip.readonly { cursor: default; }
    .status-chip.editable:hover { filter: brightness(1.08); }
    .status-popover {
      position: absolute;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
      padding: 4px 0;
      z-index: 50;
      min-width: 220px;
      max-height: 360px;
      overflow-y: auto;
    }
    .status-popover .status-option {
      padding: 6px 12px;
      cursor: pointer;
      font-size: 0.88rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-popover .status-option:hover { background: var(--bg); }
    .status-popover .status-dot {
      width: 10px; height: 10px; border-radius: 50%;
    }

    .row-actions {
      display: flex;
      gap: 6px;
    }
    .row-actions button {
      background: transparent;
      border: 0;
      cursor: pointer;
      font-size: 1.05rem;
      padding: 4px 8px;
      border-radius: 6px;
    }
    .row-actions button:hover { background: var(--bg); }

    #projectList .empty-state {
      color: var(--muted);
      font-style: italic;
      padding: 24px 8px;
    }

    /* Project-name button (opens drawer) */
    .projectNameBtn {
      background: transparent; border: 0; padding: 0;
      color: var(--primary); font-weight: 600; font-size: 0.95rem;
      cursor: pointer; text-align: left;
    }
    .projectNameBtn:hover { text-decoration: underline; }

    /* Unread-comment pulsing dot */
    .unread-dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--danger);
      margin-right: 6px;
      vertical-align: middle;
      animation: dot-pulse 1.6s ease-in-out infinite;
    }
    @keyframes dot-pulse {
      0%, 100% { transform: scale(1);   opacity: 0.9; }
      50%      { transform: scale(1.4); opacity: 0.5; }
    }

    /* Drawer + overlay */
    .drawer-overlay {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.35);
      opacity: 0; pointer-events: none;
      transition: opacity 0.18s ease-out;
      z-index: 200;
    }
    .drawer-overlay.open {
      opacity: 1; pointer-events: auto;
    }
    .drawer {
      position: fixed; top: 0; right: 0; bottom: 0;
      width: 420px; max-width: 100vw;
      background: var(--card);
      border-left: 1px solid var(--border);
      box-shadow: -4px 0 24px rgba(0, 0, 0, 0.08);
      transform: translateX(100%);
      transition: transform 0.22s ease-out;
      z-index: 201;
      display: flex; flex-direction: column;
    }
    .drawer.open { transform: translateX(0); }
    @media (max-width: 900px) {
      .drawer { width: 100vw; }
    }
    .drawer-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: flex-start; gap: 10px;
      position: sticky; top: 0; background: var(--card); z-index: 1;
    }
    .drawer-header h2 { font-size: 1.1rem; margin: 0; color: var(--text); }
    .drawer-header .meta { flex: 1; }
    .drawer-header .meta .customer { font-size: 0.88rem; color: var(--muted); margin-top: 2px; }
    .drawer-close-btn {
      background: transparent; border: 0; cursor: pointer;
      font-size: 1.4rem; color: var(--muted); padding: 0 4px;
      line-height: 1;
    }
    .drawer-close-btn:hover { color: var(--text); }
    .drawer-body {
      flex: 1; overflow-y: auto;
      padding: 16px 20px;
    }
    .drawer-section {
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }
    .drawer-section:last-child { border-bottom: 0; margin-bottom: 0; }
    .drawer-section h3 {
      font-size: 0.78rem; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.06em;
      margin-bottom: 8px;
    }
    .drawer-section .free-text {
      white-space: pre-wrap; font-size: 0.92rem; color: var(--text); line-height: 1.4;
    }
    .contact-line { font-size: 0.92rem; margin-bottom: 4px; }
    .contact-line a { color: var(--primary); text-decoration: none; }
    .contact-line a:hover { text-decoration: underline; }
    .drawer-actions {
      display: flex; gap: 8px; flex-wrap: wrap;
    }
    .drawer-actions .btn {
      flex: 1 1 auto; min-width: 140px;
      justify-content: center; font-size: 0.9rem; padding: 8px 12px;
    }

    /* Comments thread */
    .comments-list {
      display: flex; flex-direction: column; gap: 8px;
      margin-bottom: 12px;
    }
    .comment {
      background: var(--bg);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.92rem;
    }
    .comment .meta {
      font-size: 0.78rem; color: var(--muted);
      margin-bottom: 3px;
      display: flex; justify-content: space-between; gap: 8px;
    }
    .comment .meta .author { font-weight: 600; color: var(--primary-dark); }
    .comment .text { white-space: pre-wrap; line-height: 1.35; }
    .composer { display: flex; flex-direction: column; gap: 8px; }
    .composer textarea {
      width: 100%;
      border: 1px solid var(--border); border-radius: 8px;
      padding: 8px 10px; font: inherit; font-size: 0.92rem;
      resize: vertical; min-height: 70px; background: #f7f9fd;
    }
    .composer textarea:focus { outline: none; border-color: var(--primary); background: #fff; }
    .composer .composer-row {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .composer .composer-row .err { color: var(--danger); font-size: 0.82rem; flex: 1; }

    .configs-summary { font-size: 0.92rem; }
    .configs-summary li { margin-left: 18px; margin-bottom: 3px; }

  </style>
</head>
<body>

<!-- State 1: not logged in -->
<div class="card center-card" id="stateLoggedOut">
  <h1>⚡ SmartPeak — Projecten</h1>
  <p class="subtitle">Alleen voor Bloxit medewerkers.</p>
  <button type="button" class="btn" id="btnSignIn">Log in met Google</button>
  <p id="signInError" class="alert alert-error hide" style="margin-top:16px;"></p>
</div>

<!-- State 2: logged in but not whitelisted -->
<div class="card center-card hide" id="stateNotWhitelisted">
  <h1>⚠️ Geen toegang</h1>
  <p class="subtitle">Je bent ingelogd als <strong id="notWhitelistedEmail">…</strong> maar dit account heeft geen toegang tot SmartPeak Projecten.</p>
  <button type="button" class="btn btn-secondary" id="btnSignOutNW">Uitlog</button>
</div>

<!-- State 3: logged in + whitelisted -->
<div class="hide" id="stateAuthorized">
  <div class="topbar">
    <h1>⚡ SmartPeak — Projecten</h1>
    <div class="right">
      <span>Hallo, <strong id="userDisplayName">…</strong></span>
      <button type="button" class="btn btn-secondary" id="btnSignOut">Uitlog</button>
    </div>
  </div>

  <div class="card">
    <div class="toolbar">
      <button type="button" class="btn" id="btnNewProject">+ Nieuw project</button>
      <label style="display:flex;align-items:center;gap:6px;color:var(--muted);font-size:0.9rem;">
        <input type="checkbox" id="toggleShowDeleted" /> Toon verwijderde projecten
      </label>
    </div>
    <div id="projectList">Project-lijst komt in Task 5.</div>
  </div>
</div>

<!-- Right-side drawer (opens on project-name click) -->
<div class="drawer-overlay" id="drawerOverlay"></div>
<aside class="drawer" id="drawer" aria-hidden="true" role="complementary">
  <div class="drawer-header" id="drawerHeader"></div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>

<script>
// ─── ENTRY POINT ─────────────────────────────────────────────────────────────
function showState(which) {
  ['stateLoggedOut', 'stateNotWhitelisted', 'stateAuthorized'].forEach(id => {
    document.getElementById(id).classList.toggle('hide', id !== which);
  });
}

document.addEventListener('DOMContentLoaded', () => {
  // Wire sign-in button
  document.getElementById('btnSignIn').addEventListener('click', async () => {
    const errEl = document.getElementById('signInError');
    errEl.classList.add('hide');
    try {
      await signInWithGoogle();
      // onAuthStateChanged will pick up the new user and switch state.
    } catch (e) {
      errEl.textContent = 'Aanmelden mislukt: ' + (e && e.message ? e.message : e);
      errEl.classList.remove('hide');
    }
  });
  document.getElementById('btnSignOut').addEventListener('click', () => signOut());
  document.getElementById('btnSignOutNW').addEventListener('click', () => signOut());

  // New-project button → redirect to project-edit page.
  document.getElementById('btnNewProject').addEventListener('click', () => {
    window.location.href = 'project-edit.html?new=1';
  });

  // Listen for auth state changes
  onAuthStateChanged(user => {
    if (!user) {
      showState('stateLoggedOut');
      return;
    }
    if (!isWhitelisted(user)) {
      document.getElementById('notWhitelistedEmail').textContent = user.email || '(onbekend)';
      showState('stateNotWhitelisted');
      return;
    }
    document.getElementById('userDisplayName').textContent = user.displayName || user.email;
    showState('stateAuthorized');
    refreshProjectList();
  });

  document.getElementById('toggleShowDeleted').addEventListener('change', refreshProjectList);
});

// ─── PROJECT LIST ───────────────────────────────────────────────────────────
function fmtDate(ts) {
  // ts = Firestore Timestamp
  if (!ts || typeof ts.toDate !== 'function') return '—';
  return ts.toDate().toLocaleDateString('nl-BE', { day: '2-digit', month: 'short', year: 'numeric' });
}

function shortName(email) {
  if (!email) return '—';
  return email.split('@')[0];
}

function statusChipHTML(statusKey, projectId) {
  const meta = getStatusMeta(statusKey);
  return `<span class="status-chip editable" data-status="${meta.key}" data-project-id="${projectId}" style="background:${meta.color};">${meta.label}</span>`;
}

let _openPopover = null;
function closeStatusPopover() {
  if (_openPopover) { _openPopover.remove(); _openPopover = null; }
}

function openStatusPopover(chip) {
  closeStatusPopover();
  const projectId = chip.dataset.projectId;
  const currentKey = chip.dataset.status;
  const pop = document.createElement('div');
  pop.className = 'status-popover';
  pop.innerHTML = PROJECT_STATUSES.map(s => `
    <div class="status-option" data-status="${s.key}">
      <span class="status-dot" style="background:${s.color}"></span>
      <span>${s.label}</span>
      ${s.key === currentKey ? '<span style="margin-left:auto;color:var(--muted);">✓</span>' : ''}
    </div>
  `).join('');
  document.body.appendChild(pop);
  const rect = chip.getBoundingClientRect();
  pop.style.left = `${rect.left + window.scrollX}px`;
  pop.style.top  = `${rect.bottom + window.scrollY + 4}px`;
  _openPopover = pop;

  pop.querySelectorAll('.status-option').forEach(opt => {
    opt.addEventListener('click', async (e) => {
      e.stopPropagation();
      const newStatus = opt.dataset.status;
      closeStatusPopover();
      if (newStatus === currentKey) return;
      try {
        await updateProjectStatus(projectId, newStatus);
        await refreshProjectList();
      } catch (err) {
        alert('Kon status niet wijzigen: ' + (err && err.message ? err.message : err));
      }
    });
  });

  // Close on outside click
  setTimeout(() => {
    document.addEventListener('click', closeStatusPopover, { once: true });
  }, 0);
}

function rowHTML(p, isDeleted) {
  const updated = fmtDate(p.updatedAt);
  const by      = shortName(p.createdBy);
  const editBtn = isDeleted
    ? ''
    : `<button type="button" class="editBtn" data-id="${p.id}" title="Bewerken">✏️</button>`;
  const calcBtn = (!isDeleted && p.lastCalcRun && p.lastCalcRun.calculatedAt)
    ? `<button type="button" class="calcBtn" data-id="${p.id}" title="Open berekening">🧮</button>`
    : '';
  const action  = isDeleted
    ? `<button type="button" class="restoreBtn"  data-id="${p.id}" title="Herstellen">↶</button>`
    : `<button type="button" class="deleteBtn"   data-id="${p.id}" title="Verwijderen">🗑️</button>`;
  const email  = currentUserEmail();
  const dot    = hasUnreadComments(p, email)
    ? `<span class="unread-dot" title="Nieuwe opmerking(en)"></span>`
    : '';
  return `
    <tr class="${isDeleted ? 'deleted-row' : ''}">
      <td>${dot}<button type="button" class="projectNameBtn" data-id="${p.id}">${escapeHtml(p.projectName || '')}</button></td>
      <td>${escapeHtml(p.customerName || '')}</td>
      <td>${statusChipHTML(p.status, p.id)}</td>
      <td>${updated}</td>
      <td>${by}</td>
      <td class="row-actions">
        ${calcBtn}
        ${editBtn}
        ${action}
      </td>
    </tr>`;
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

async function refreshProjectList() {
  const el = document.getElementById('projectList');
  el.innerHTML = '<p class="empty-state">⏳ Laden…</p>';
  const showDeleted = document.getElementById('toggleShowDeleted').checked;
  try {
    const active  = await listActiveProjects();
    const deleted = showDeleted ? await listDeletedProjects() : [];
    const total = active.length + deleted.length;
    if (total === 0) {
      el.innerHTML = '<p class="empty-state">Nog geen projecten. Klik op <strong>+ Nieuw project</strong> om te beginnen.</p>';
      return;
    }
    const rows = [
      ...active.map(p => rowHTML(p, false)),
      ...deleted.map(p => rowHTML(p, true)),
    ].join('');
    el.innerHTML = `
      <table class="project-table">
        <thead><tr>
          <th>Project</th><th>Klant</th><th>Status</th><th>Bijgewerkt</th><th>Door</th><th></th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
    // Wire project-name buttons → open drawer
    el.querySelectorAll('.projectNameBtn').forEach(btn => {
      btn.addEventListener('click', () => openDrawer(btn.dataset.id));
    });
    // Wire edit buttons
    el.querySelectorAll('.editBtn').forEach(btn => {
      btn.addEventListener('click', () => { window.location.href = `project-edit.html?project=${btn.dataset.id}`; });
    });
    // Wire calc-result jump buttons
    el.querySelectorAll('.calcBtn').forEach(btn => {
      btn.addEventListener('click', () => { window.location.href = `index.html?project=${btn.dataset.id}#results`; });
    });
    // Wire status-chip popovers
    el.querySelectorAll('.status-chip.editable').forEach(chip => {
      chip.addEventListener('click', (e) => {
        e.stopPropagation();
        openStatusPopover(chip);
      });
    });
    // Wire delete buttons
    el.querySelectorAll('.deleteBtn').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('Project verwijderen? Het wordt soft-deleted en blijft herstelbaar via "Toon verwijderde projecten".')) return;
        try {
          await softDeleteProject(btn.dataset.id);
          await refreshProjectList();
        } catch (err) {
          alert('Kon niet verwijderen: ' + (err && err.message ? err.message : err));
        }
      });
    });
    // Wire restore buttons
    el.querySelectorAll('.restoreBtn').forEach(btn => {
      btn.addEventListener('click', async () => {
        try {
          await restoreProject(btn.dataset.id);
          await refreshProjectList();
        } catch (err) {
          alert('Kon niet herstellen: ' + (err && err.message ? err.message : err));
        }
      });
    });
  } catch (e) {
    el.innerHTML = `<div class="alert alert-error">Kon projecten niet laden: ${escapeHtml(e && e.message ? e.message : String(e))}</div>`;
  }
}

// ─── DRAWER ──────────────────────────────────────────────────────────────────
let _drawerProjectId = null;

function fmtRelTime(ts) {
  if (!ts || typeof ts.toDate !== 'function') return '—';
  const date = ts.toDate();
  const diffSec = Math.max(0, Math.floor((Date.now() - date.getTime()) / 1000));
  if (diffSec < 60)     return 'net nu';
  if (diffSec < 3600)   return Math.floor(diffSec / 60) + ' min geleden';
  const sameDay = date.toDateString() === new Date().toDateString();
  if (sameDay) return 'vandaag ' + date.toLocaleTimeString('nl-BE', { hour: '2-digit', minute: '2-digit' });
  const yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
  if (date.toDateString() === yesterday.toDateString()) {
    return 'gisteren ' + date.toLocaleTimeString('nl-BE', { hour: '2-digit', minute: '2-digit' });
  }
  return date.toLocaleDateString('nl-BE', { day: '2-digit', month: 'short' }) +
         ' ' + date.toLocaleTimeString('nl-BE', { hour: '2-digit', minute: '2-digit' });
}

async function openDrawer(projectId) {
  _drawerProjectId = projectId;
  const drawer  = document.getElementById('drawer');
  const overlay = document.getElementById('drawerOverlay');
  const body    = document.getElementById('drawerBody');
  const header  = document.getElementById('drawerHeader');

  body.innerHTML   = '<p class="empty-state">⏳ Laden…</p>';
  header.innerHTML = '<div class="meta"><h2>…</h2></div><button type="button" class="drawer-close-btn" aria-label="Sluit">×</button>';
  header.querySelector('.drawer-close-btn').addEventListener('click', closeDrawer);

  drawer.classList.add('open');
  overlay.classList.add('open');
  drawer.setAttribute('aria-hidden', 'false');

  try {
    const project = await getProject(projectId);
    if (!project || project.deletedAt) {
      body.innerHTML = '<div class="alert alert-error">Project niet gevonden of verwijderd.</div>';
      return;
    }
    renderDrawer(project);
    const comments = await listComments(projectId);
    renderComments(project, comments);
    // Mark read (non-blocking). Refresh list so the pulse dot disappears.
    markCommentsRead(projectId).then(() => {
      setTimeout(refreshProjectList, 400);
    }).catch(err => console.warn('markCommentsRead failed', err));
  } catch (e) {
    body.innerHTML = `<div class="alert alert-error">Kon project niet laden: ${escapeHtml(e && e.message ? e.message : String(e))}</div>`;
  }
}

function closeDrawer() {
  const drawer  = document.getElementById('drawer');
  const overlay = document.getElementById('drawerOverlay');
  drawer.classList.remove('open');
  overlay.classList.remove('open');
  drawer.setAttribute('aria-hidden', 'true');
  _drawerProjectId = null;
}

function renderDrawer(project) {
  const header = document.getElementById('drawerHeader');
  const body   = document.getElementById('drawerBody');
  const m      = mergeProjectMetadata(project);

  header.innerHTML = `
    <div class="meta">
      <h2>${escapeHtml(project.projectName || '(zonder naam)')}</h2>
      <div class="customer">${escapeHtml(project.customerName || '')} · ${statusChipHTML(project.status, project.id)}</div>
    </div>
    <button type="button" class="drawer-close-btn" aria-label="Sluit">×</button>
  `;
  header.querySelector('.drawer-close-btn').addEventListener('click', closeDrawer);
  header.querySelectorAll('.status-chip.editable').forEach(chip => {
    chip.addEventListener('click', (e) => { e.stopPropagation(); openStatusPopover(chip); });
  });

  // Build sections conditionally.
  const sections = [];

  // Contact
  const contactLines = [];
  if (m.customer.address) contactLines.push(`<div class="contact-line" style="white-space:pre-wrap;">📍 ${escapeHtml(m.customer.address)}</div>`);
  if (m.customer.phone)   contactLines.push(`<div class="contact-line">📞 <a href="tel:${escapeHtml(m.customer.phone)}">${escapeHtml(m.customer.phone)}</a></div>`);
  if (m.customer.email)   contactLines.push(`<div class="contact-line">✉️ <a href="mailto:${escapeHtml(m.customer.email)}">${escapeHtml(m.customer.email)}</a></div>`);
  if (contactLines.length > 0) {
    sections.push(`<div class="drawer-section"><h3>Contact</h3>${contactLines.join('')}</div>`);
  }

  // Actions
  const calcHref = project.lastCalcRun && project.lastCalcRun.calculatedAt
    ? `index.html?project=${project.id}#results`
    : `index.html?project=${project.id}`;
  sections.push(`
    <div class="drawer-section">
      <div class="drawer-actions">
        <a class="btn" href="${calcHref}">🧮 Open berekening</a>
        <a class="btn btn-secondary" href="project-edit.html?project=${project.id}">✏ Bewerk project</a>
      </div>
    </div>
  `);

  // Configs summary
  const configs = (project.lastCalcRun && project.lastCalcRun.inputs && project.lastCalcRun.inputs.selectedConfigTypes) || [];
  if (configs.length > 0) {
    sections.push(`
      <div class="drawer-section">
        <h3>Gekozen configuraties</h3>
        <ul class="configs-summary">${configs.map(c => `<li>${escapeHtml(c)}</li>`).join('')}</ul>
      </div>
    `);
  }

  // Situation
  if (m.situation) {
    sections.push(`<div class="drawer-section"><h3>Situatie</h3><div class="free-text">${escapeHtml(m.situation)}</div></div>`);
  }
  // Notes
  if (m.notes) {
    sections.push(`<div class="drawer-section"><h3>Notities</h3><div class="free-text">${escapeHtml(m.notes)}</div></div>`);
  }

  // Comments placeholder (filled by renderComments)
  sections.push(`
    <div class="drawer-section" id="drawerCommentsSection">
      <h3>💬 Opmerkingen <span id="drawerCommentsCount" style="font-weight:400;color:var(--muted);"></span></h3>
      <div class="comments-list" id="drawerCommentsList"><p class="empty-state">⏳ Laden…</p></div>
      <div class="composer">
        <textarea id="drawerCommentInput" placeholder="Plaats een opmerking…" maxlength="4000"></textarea>
        <div class="composer-row">
          <div class="err" id="drawerCommentErr"></div>
          <button type="button" class="btn" id="drawerCommentSubmit">Plaats opmerking</button>
        </div>
      </div>
    </div>
  `);

  body.innerHTML = sections.join('');

  // Wire comment submit
  document.getElementById('drawerCommentSubmit').addEventListener('click', async () => {
    const errEl = document.getElementById('drawerCommentErr');
    const btn   = document.getElementById('drawerCommentSubmit');
    const input = document.getElementById('drawerCommentInput');
    errEl.textContent = '';
    const text = input.value;
    if (!text.trim()) { errEl.textContent = 'Leeg.'; return; }
    btn.disabled = true; btn.textContent = 'Bezig…';
    try {
      await addComment(project.id, text);
      input.value = '';
      // Refresh comments list
      const fresh = await listComments(project.id);
      renderComments(project, fresh);
    } catch (e) {
      errEl.textContent = e && e.message ? e.message : String(e);
    } finally {
      btn.disabled = false; btn.textContent = 'Plaats opmerking';
    }
  });
}

function renderComments(project, comments) {
  const list = document.getElementById('drawerCommentsList');
  const count = document.getElementById('drawerCommentsCount');
  if (!list) return;
  count.textContent = comments.length > 0 ? `(${comments.length})` : '';
  if (comments.length === 0) {
    list.innerHTML = '<p class="empty-state" style="font-style:italic;color:var(--muted);">Nog geen opmerkingen. Plaats er één hieronder.</p>';
    return;
  }
  list.innerHTML = comments.map(c => `
    <div class="comment">
      <div class="meta">
        <span class="author">${escapeHtml(shortName(c.author))}</span>
        <span>${fmtRelTime(c.createdAt)}</span>
      </div>
      <div class="text">${escapeHtml(c.text || '')}</div>
    </div>
  `).join('');
  // Scroll last comment into view if the newest is below the fold.
  const lastComment = list.lastElementChild;
  if (lastComment) lastComment.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// Drawer close hooks
document.addEventListener('DOMContentLoaded', () => {
  const overlay = document.getElementById('drawerOverlay');
  if (overlay) overlay.addEventListener('click', closeDrawer);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && _drawerProjectId) closeDrawer();
  });
});
</script>

</body>
</html>
