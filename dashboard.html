<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" integrity="sha512-jnSuA4Ss2PkkikSOLtYs8BlYIeeIK1h99ty4YfvRPAlzr377vr3CXDb7sb7eEEBYjDtcYj+AjBH3FLv5uSJuSg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="assets/css/smartpeak.css" />
  <title>SmartPeak — Projecten</title>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-storage-compat.js"></script>
  <script src="assets/js/csv.js"></script>
  <script src="assets/js/firebase-init.js"></script>
  <style>
    /*
     * Page-specific overrides live here. Global app styles are in
     * assets/css/smartpeak.css (loaded above). Keep this block empty
     * unless a rule is truly only relevant for dashboard.html.
     */

    /* Offerte-modal body styles (rendered by renderOfferteModalBody) */
    .offerte-cfg-header { margin-bottom: 10px; }
    .offerte-existing { padding: 10px; background: #f8fafc; border-radius: 6px; margin-bottom: 12px; font-size: 0.9rem; }
    .offerte-row { padding: 10px 0; border-bottom: 1px solid var(--bs-border-color); }
    .offerte-row.dismissed { opacity: 0.55; }
    .offerte-row:last-child { border-bottom: 0; }
    .offerte-row-head { display: flex; align-items: center; gap: 8px; }
    .offerte-row-title { font-weight: 600; font-size: 0.92rem; }
    .offerte-row-meta, .offerte-row-pdf { font-size: 0.85rem; color: var(--sp-muted); margin-top: 4px; }
    .offerte-row-actions { display: flex; gap: 6px; margin-top: 6px; }
    .offerte-divider { text-align: center; color: var(--sp-muted); font-size: 0.82rem; margin: 16px 0 8px; }
  </style>
</head>
<body>

<!-- State 1: not logged in -->
<div class="card mx-auto mt-5" id="stateLoggedOut" style="max-width:480px">
  <div class="card-body text-center p-4">
    <h1 class="h4 mb-2"><i class="fa-solid fa-bolt text-primary"></i> SmartPeak — Projecten</h1>
    <p class="text-muted mb-3">Alleen voor Bloxit medewerkers.</p>
    <button type="button" class="btn btn-primary" id="btnSignIn">Log in met Google</button>
    <p id="signInError" class="alert alert-danger mt-3 hide"></p>
  </div>
</div>

<!-- State 2: logged in but not whitelisted -->
<div class="card mx-auto mt-5 hide" id="stateNotWhitelisted" style="max-width:480px">
  <div class="card-body text-center p-4">
    <h1 class="h4 mb-2"><i class="fa-solid fa-triangle-exclamation icon-danger"></i> Geen toegang</h1>
    <p class="text-muted mb-3">Je bent ingelogd als <strong id="notWhitelistedEmail">…</strong> maar dit account heeft geen toegang tot SmartPeak Projecten.</p>
    <button type="button" class="btn btn-outline-secondary" id="btnSignOutNW">Uitloggen</button>
  </div>
</div>

<!-- State 3: logged in + whitelisted -->
<div class="hide" id="stateAuthorized">
  <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1"><i class="fa-solid fa-bolt text-primary"></i> SmartPeak — Projecten</span>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarContent">
        <ul class="navbar-nav ms-auto align-items-lg-center gap-2">
          <li class="nav-item">Hallo, <strong id="userDisplayName">…</strong></li>
          <li class="nav-item">
            <button type="button" class="btn btn-outline-secondary btn-sm" id="btnSignOut">Uitloggen</button>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container-fluid py-3">

    <!-- Toolbar -->
    <div class="card mb-3">
      <div class="card-body">
        <div class="row g-2 align-items-center">
          <div class="col-12 col-md-auto">
            <button type="button" class="btn btn-primary w-100 w-md-auto" id="btnNewProject">
              <i class="fa-solid fa-plus me-1"></i> Nieuw project
            </button>
          </div>
          <div class="col-12 col-md">
            <div class="input-group">
              <span class="input-group-text"><i class="fa-solid fa-magnifying-glass"></i></span>
              <input type="search" id="projectSearch" class="form-control" placeholder="Zoek projectnaam of klant…" />
            </div>
          </div>
          <div class="col-6 col-md-auto">
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" id="toggleShowFinished">
              <label class="form-check-label" for="toggleShowFinished">Toon afgesloten</label>
            </div>
          </div>
          <div class="col-6 col-md-auto">
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" id="toggleShowDeleted">
              <label class="form-check-label" for="toggleShowDeleted">Toon verwijderde</label>
            </div>
          </div>
          <div class="col-12 col-lg-auto d-none d-lg-block">
            <div class="btn-group" role="group" id="viewToggle" aria-label="View toggle">
              <button type="button" class="btn btn-outline-primary active" data-view="list">
                <i class="fa-solid fa-list"></i> Lijst
              </button>
              <button type="button" class="btn btn-outline-primary" data-view="board">
                <i class="fa-solid fa-table-columns"></i> Bord
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Project list / kanban -->
    <div class="card">
      <div class="card-body p-0 p-md-3" id="projectList">
        <p class="sp-empty-state">⏳ Laden…</p>
      </div>
    </div>
  </main>
</div>

<!-- Right-side drawer (opens on project-name click) -->
<div class="offcanvas offcanvas-end" tabindex="-1" id="drawer" aria-labelledby="drawerHeaderTitle">
  <div class="offcanvas-header border-bottom" id="drawerHeader"></div>
  <div class="offcanvas-body" id="drawerBody"></div>
</div>

<div class="modal fade" id="offerteModal" tabindex="-1" aria-labelledby="offerteModalTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="offerteModalTitle">Offerte uploaden</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Sluiten"></button>
      </div>
      <div class="modal-body" id="offerteModalBody"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" id="offerteModalCancel" data-bs-dismiss="modal">Annuleren</button>
      </div>
    </div>
  </div>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer" style="z-index:1090"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js" integrity="sha512-1/RvZTcCDEUjY/CypiMz+iqqtaoQfAITmNSJY17Myp4Ms5mdxPS5UV7iOfdZoxcGhzFbOm6sntTKJppjvuhg4g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

<script>
// ─── ENTRY POINT ─────────────────────────────────────────────────────────────
function showState(which) {
  ['stateLoggedOut', 'stateNotWhitelisted', 'stateAuthorized'].forEach(id => {
    document.getElementById(id).classList.toggle('hide', id !== which);
  });
}

document.addEventListener('DOMContentLoaded', () => {
  // Wire sign-in button
  document.getElementById('btnSignIn').addEventListener('click', async () => {
    const errEl = document.getElementById('signInError');
    errEl.classList.add('hide');
    try {
      await signInWithGoogle();
      // onAuthStateChanged will pick up the new user and switch state.
    } catch (e) {
      errEl.textContent = 'Aanmelden mislukt: ' + (e && e.message ? e.message : e);
      errEl.classList.remove('hide');
    }
  });
  document.getElementById('btnSignOut').addEventListener('click', () => signOut());
  document.getElementById('btnSignOutNW').addEventListener('click', () => signOut());

  // New-project button → redirect to project-edit page.
  document.getElementById('btnNewProject').addEventListener('click', () => {
    window.location.href = 'project-edit.html?new=1';
  });

  // Listen for auth state changes
  onAuthStateChanged(user => {
    if (!user) {
      showState('stateLoggedOut');
      return;
    }
    if (!isWhitelisted(user)) {
      document.getElementById('notWhitelistedEmail').textContent = user.email || '(onbekend)';
      showState('stateNotWhitelisted');
      return;
    }
    document.getElementById('userDisplayName').textContent = user.displayName || user.email;
    showState('stateAuthorized');
    refreshProjectList();
  });

  document.getElementById('toggleShowDeleted').addEventListener('change', refreshProjectList);
  document.getElementById('toggleShowFinished').addEventListener('change', refreshProjectList);
  document.getElementById('projectSearch').addEventListener('input', () => {
    // Debounce: re-render only (already-loaded list) without re-fetching Firestore.
    renderCurrent();
  });
  // View toggle (Lijst / Bord). Remembers choice in localStorage.
  document.querySelectorAll('#viewToggle button').forEach(btn => {
    btn.addEventListener('click', () => {
      const v = btn.dataset.view;
      try { localStorage.setItem('smartpeak.dashboardView', v); } catch {}
      document.querySelectorAll('#viewToggle button').forEach(b => b.classList.toggle('active', b === btn));
      renderCurrent();
    });
  });
  // Restore view choice on load (default = list).
  try {
    const saved = localStorage.getItem('smartpeak.dashboardView') || 'list';
    document.querySelectorAll('#viewToggle button').forEach(b => b.classList.toggle('active', b.dataset.view === saved));
  } catch {}

  // Reset drawer state when Bootstrap hides it (hidden.bs.offcanvas also handled above)
});

// ─── PROJECT LIST ───────────────────────────────────────────────────────────
function fmtDate(ts) {
  // ts = Firestore Timestamp
  if (!ts || typeof ts.toDate !== 'function') return '—';
  return ts.toDate().toLocaleDateString('nl-BE', { day: '2-digit', month: 'short', year: 'numeric' });
}

function shortName(email) {
  if (!email) return '—';
  return email.split('@')[0];
}

function statusChipHTML(statusKey, projectId) {
  const meta = getStatusMeta(statusKey);
  const readonly = projectId == null;
  if (readonly) {
    return `<span class="badge status-chip readonly" style="background:${meta.color};color:#fff;">${escapeHtml(meta.label)}</span>`;
  }
  const dropdownId = `stDd_${projectId}`;
  const options = PROJECT_STATUSES.map(s => `
    <li><button type="button" class="dropdown-item d-flex align-items-center gap-2"
                data-status="${s.key}" data-project-id="${projectId}">
      <span class="d-inline-block rounded-circle" style="width:10px;height:10px;background:${s.color};flex-shrink:0;"></span>
      ${escapeHtml(s.label)}
    </button></li>
  `).join('');
  return `
    <div class="dropdown d-inline-block">
      <button type="button" class="badge status-chip border-0" style="background:${meta.color};color:#fff;"
              id="${dropdownId}" data-bs-toggle="dropdown" aria-expanded="false">
        ${escapeHtml(meta.label)} <i class="fa-solid fa-caret-down ms-1"></i>
      </button>
      <ul class="dropdown-menu" aria-labelledby="${dropdownId}">${options}</ul>
    </div>
  `;
}

function rowHTML(p, isDeleted) {
  const updated = fmtDate(p.updatedAt);
  const editBtn = isDeleted
    ? ''
    : `<a class="btn btn-sm btn-outline-secondary editBtn" data-id="${p.id}" href="project-edit.html?project=${p.id}" title="Bewerk"><i class="fa-solid fa-pen-to-square" aria-hidden="true"></i></a>`;
  const calcBtn = (!isDeleted && p.lastCalcRun && p.lastCalcRun.calculatedAt)
    ? `<a class="btn btn-sm btn-outline-secondary calcBtn" data-id="${p.id}" href="index.html?project=${p.id}#results" title="Open berekening"><i class="fa-solid fa-calculator" aria-hidden="true"></i></a>`
    : '';
  const action  = isDeleted
    ? `<button type="button" class="btn btn-sm btn-outline-secondary restoreBtn" data-id="${p.id}" title="Herstellen"><i class="fa-solid fa-rotate-left" aria-hidden="true"></i></button>
       <button type="button" class="btn btn-sm btn-outline-danger permdelBtn"   data-id="${p.id}" data-name="${escapeHtml(p.projectName || '')}" title="Definitief verwijderen"><i class="fa-solid fa-circle-xmark" aria-hidden="true"></i></button>`
    : `<button type="button" class="btn btn-sm btn-outline-danger deleteBtn"    data-id="${p.id}" title="Verwijderen"><i class="fa-solid fa-trash" aria-hidden="true"></i></button>`;
  const email  = currentUserEmail();
  const chat   = hasAnyComments(p)
    ? `<span class="chat-indicator ${hasUnreadComments(p, email) ? 'unread' : ''}" title="${hasUnreadComments(p, email) ? 'Nieuwe opmerking(en) van collega' : 'Opmerkingen aanwezig'}"><i class="fa-solid fa-comment-dots" aria-hidden="true"></i></span>`
    : '';
  const warn   = needsGroundFaultCheck(p)
    ? `<span class="row-warning" title="Controleer fase↔aarde spanning: bij Zendure-installaties moet dit &lt; 30 V zijn. Zet de vink in het project zodra gemeten."><i class="fa-solid fa-triangle-exclamation icon-danger" aria-hidden="true"></i></span>`
    : '';
  const warnOfferte = needsOfferteWarning(p)
    ? `<span class="row-warning row-warning-offerte" title="Offertes ontbreken — klant zit in offerte-fase maar er zijn configs zonder PDF."><i class="fa-solid fa-triangle-exclamation icon-warn" aria-hidden="true"></i></span>`
    : '';
  return `
    <tr class="${isDeleted ? 'text-muted opacity-50' : ''}" data-id="${p.id}">
      <td>${chat}${warn}${warnOfferte}<button type="button" class="btn btn-link p-0 text-decoration-none fw-semibold projectNameBtn" data-id="${p.id}">${escapeHtml(p.projectName || '')}</button></td>
      <td class="d-none d-sm-table-cell">${escapeHtml(p.customerName || '')}</td>
      <td>${statusChipHTML(p.status, p.id)}</td>
      <td class="d-none d-sm-table-cell text-muted small">${updated}</td>
      <td class="text-end">
        <div class="d-flex gap-1 justify-content-end">
          ${calcBtn}
          ${editBtn}
          ${action}
        </div>
      </td>
    </tr>`;
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

function showToast(message, variant = 'primary') {
  const container = document.getElementById('toastContainer');
  const id = 't_' + Date.now();
  const html = `
    <div id="${id}" class="toast text-bg-${variant} border-0" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body">${escapeHtml(message)}</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Sluiten"></button>
      </div>
    </div>
  `;
  container.insertAdjacentHTML('beforeend', html);
  const el = document.getElementById(id);
  const t = bootstrap.Toast.getOrCreateInstance(el, { delay: 4000 });
  el.addEventListener('hidden.bs.toast', () => el.remove());
  t.show();
}

// Cached list of projects from Firestore. Filtering + render happens on this cache.
let _projectsCache = { active: [], deleted: [] };

async function refreshProjectList() {
  const el = document.getElementById('projectList');
  el.innerHTML = '<p class="sp-empty-state">⏳ Laden…</p>';
  const showDeleted = document.getElementById('toggleShowDeleted').checked;
  try {
    _projectsCache.active  = await listActiveProjects();
    _projectsCache.deleted = showDeleted ? await listDeletedProjects() : [];
    renderCurrent();
  } catch (e) {
    el.innerHTML = `<div class="alert alert-danger">Kon projecten niet laden: ${escapeHtml(e && e.message ? e.message : String(e))}</div>`;
  }
}

function currentView() {
  if (window.innerWidth < 992) return 'list';
  return localStorage.getItem('smartpeak.dashboardView') || 'list';
}

// Apply filters (search + show-finished) to the cached projects and render in the
// currently-active view mode (list or board).
function renderCurrent() {
  const el = document.getElementById('projectList');
  const searchQ = (document.getElementById('projectSearch').value || '').trim().toLowerCase();
  const showFinished = document.getElementById('toggleShowFinished').checked;

  const matchesFilters = p => {
    if (!p.deletedAt && !showFinished && FINISHED_STATUSES.includes(p.status)) return false;
    if (searchQ) {
      const hay = ((p.projectName || '') + ' ' + (p.customerName || '')).toLowerCase();
      if (!hay.includes(searchQ)) return false;
    }
    return true;
  };

  const active  = _projectsCache.active.filter(matchesFilters);
  const deleted = _projectsCache.deleted.filter(matchesFilters);

  if (active.length + deleted.length === 0) {
    el.innerHTML = '<p class="sp-empty-state">Geen projecten die voldoen aan de filters.</p>';
    return;
  }

  const viewMode = currentView();
  if (viewMode === 'board') {
    renderBoard(active, el);
  } else {
    renderList(active, deleted, el);
  }
}

function renderList(active, deleted, el) {
  const rows = [
    ...active.map(p => rowHTML(p, false)),
    ...deleted.map(p => rowHTML(p, true)),
  ].join('');
  el.innerHTML = `
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead>
          <tr>
            <th>Project</th>
            <th class="d-none d-sm-table-cell">Klant</th>
            <th>Status</th>
            <th class="d-none d-sm-table-cell">Gewijzigd</th>
            <th class="text-end">Acties</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
  wireRowActions(el);
}

function renderBoard(active, el) {
  // Only non-deleted projects in the board view.
  const byPhase = new Map(PROJECT_PHASES.map(p => [p.key, []]));
  for (const proj of active) {
    const phase = phaseForStatus(proj.status);
    byPhase.get(phase.key).push(proj);
  }
  el.innerHTML = `
    <div class="kanban-board">
      ${PROJECT_PHASES.map(phase => {
        const items = byPhase.get(phase.key);
        return `
          <div class="kanban-col" data-phase="${phase.key}">
            <div class="kanban-col-header">
              <span><span class="phase-dot" style="background:${phase.color};"></span>${phase.label}</span>
              <span class="count">${items.length}</span>
            </div>
            <div class="kanban-col-body">
              ${items.map(p => kanbanCardHTML(p)).join('') || '<p class="empty-state" style="font-size:0.82rem;color:var(--muted);">—</p>'}
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;
  wireBoard(el);
}

function kanbanCardHTML(p) {
  const email = currentUserEmail();
  const chat  = hasAnyComments(p)
    ? `<span class="chat-indicator ${hasUnreadComments(p, email) ? 'unread' : ''}" title="${hasUnreadComments(p, email) ? 'Nieuwe opmerking(en)' : 'Opmerkingen aanwezig'}"><i class="fa-solid fa-comment-dots" aria-hidden="true"></i></span>`
    : '';
  const warn  = needsGroundFaultCheck(p)
    ? `<span class="row-warning" title="Controleer fase↔aarde meting bij Zendure (&lt; 30 V)."><i class="fa-solid fa-triangle-exclamation icon-danger" aria-hidden="true"></i></span>`
    : '';
  const warnOfferte = needsOfferteWarning(p)
    ? `<span class="row-warning row-warning-offerte" title="Offertes ontbreken — klant zit in offerte-fase maar er zijn configs zonder PDF."><i class="fa-solid fa-triangle-exclamation icon-warn" aria-hidden="true"></i></span>`
    : '';
  return `
    <div class="kanban-card" draggable="true" data-id="${p.id}">
      <div class="kanban-card-title" data-id="${p.id}">${chat}${warn}${warnOfferte}${escapeHtml(p.projectName || '')}</div>
      <div class="kanban-card-customer">${escapeHtml(p.customerName || '')}</div>
      <div class="kanban-card-footer">
        ${statusChipHTML(p.status, p.id)}
      </div>
    </div>
  `;
}

function wireRowActions(el) {
  // Wire project-name buttons → open drawer
  el.querySelectorAll('.projectNameBtn').forEach(btn => {
    btn.addEventListener('click', () => openDrawer(btn.dataset.id));
  });
  el.querySelectorAll('.deleteBtn').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('Project verwijderen? Het wordt soft-deleted en blijft herstelbaar via "Toon verwijderde".')) return;
      try { await softDeleteProject(btn.dataset.id); await refreshProjectList(); }
      catch (err) { alert('Kon niet verwijderen: ' + (err && err.message ? err.message : err)); }
    });
  });
  el.querySelectorAll('.restoreBtn').forEach(btn => {
    btn.addEventListener('click', async () => {
      try { await restoreProject(btn.dataset.id); await refreshProjectList(); }
      catch (err) { alert('Kon niet herstellen: ' + (err && err.message ? err.message : err)); }
    });
  });
  el.querySelectorAll('.permdelBtn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id   = btn.dataset.id;
      const name = btn.dataset.name || '(project)';
      if (!confirm(`Definitief verwijderen van '${name}'?\n\nAlle gegevens, opmerkingen en foto's worden permanent gewist. Dit kan niet ongedaan worden.`)) return;
      try {
        btn.disabled = true;
        await hardDeleteProject(id);
        await refreshProjectList();
      } catch (err) {
        alert('Definitief verwijderen mislukt: ' + (err && err.message ? err.message : err));
        btn.disabled = false;
      }
    });
  });
}

function wireBoard(el) {
  // Name-click → drawer
  el.querySelectorAll('.kanban-card-title').forEach(t => {
    t.addEventListener('click', () => openDrawer(t.dataset.id));
  });
  // Drag & drop: cards draggable, columns are drop targets.
  el.querySelectorAll('.kanban-card').forEach(card => {
    card.addEventListener('dragstart', e => {
      e.dataTransfer.setData('text/plain', card.dataset.id);
      e.dataTransfer.effectAllowed = 'move';
      card.classList.add('dragging');
    });
    card.addEventListener('dragend', () => card.classList.remove('dragging'));
  });
  el.querySelectorAll('.kanban-col').forEach(col => {
    col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('drag-over'); });
    col.addEventListener('dragleave', e => {
      // Only clear highlight when leaving the column entirely.
      if (!col.contains(e.relatedTarget)) col.classList.remove('drag-over');
    });
    col.addEventListener('drop', async e => {
      e.preventDefault();
      col.classList.remove('drag-over');
      const id       = e.dataTransfer.getData('text/plain');
      const phaseKey = col.dataset.phase;
      if (!id || !phaseKey) return;
      const phase = PROJECT_PHASES.find(p => p.key === phaseKey);
      if (!phase) return;
      // No-op if already in this phase.
      const proj = _projectsCache.active.find(p => p.id === id);
      if (proj && phaseForStatus(proj.status).key === phaseKey) return;
      try {
        await updateProjectStatus(id, phase.statuses[0]);
        await refreshProjectList();
      } catch (err) {
        alert('Status wijzigen mislukt: ' + (err && err.message ? err.message : err));
      }
    });
  });
}

let _currentDrawerProject = null;

function fmtRelTime(ts) {
  if (!ts || typeof ts.toDate !== 'function') return '—';
  const date = ts.toDate();
  const diffSec = Math.max(0, Math.floor((Date.now() - date.getTime()) / 1000));
  if (diffSec < 60)     return 'net nu';
  if (diffSec < 3600)   return Math.floor(diffSec / 60) + ' min geleden';
  const sameDay = date.toDateString() === new Date().toDateString();
  if (sameDay) return 'vandaag ' + date.toLocaleTimeString('nl-BE', { hour: '2-digit', minute: '2-digit' });
  const yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
  if (date.toDateString() === yesterday.toDateString()) {
    return 'gisteren ' + date.toLocaleTimeString('nl-BE', { hour: '2-digit', minute: '2-digit' });
  }
  return date.toLocaleDateString('nl-BE', { day: '2-digit', month: 'short' }) +
         ' ' + date.toLocaleTimeString('nl-BE', { hour: '2-digit', minute: '2-digit' });
}

function closeOfferteModal() {
  const el = document.getElementById('offerteModal');

}

function _findConfigByType(project, configType) {
  const results = project.lastCalcRun && project.lastCalcRun.results;
  const cfgResults = results && Array.isArray(results.configResults) ? results.configResults : [];
  const match = cfgResults.find(cr => cr.cfg && cr.cfg.type === configType);
  const cfg = match ? match.cfg : { type: configType, omschrijving: '' };
  const priceKey = _getProjectPriceKey(project);
  // cfg.price is resolved at calc time; cfg.prices[key] is the raw lookup fallback
  const priceEur = cfg.price || (cfg.prices && cfg.prices[priceKey]) || 0;
  return {
    type:        cfg.type || configType,
    omschrijving:cfg.omschrijving || '',
    batCap:      cfg.batCap || null,
    batInv:      cfg.batInv || null,
    priceEur
  };
}

function _getProjectPriceKey(project) {
  const btw     = (typeof effectiveBtwFor === 'function') ? effectiveBtwFor(project) : 21;
  const keuring = (project.calcDefaults && project.calcDefaults.inspectieGekozen === true) ? 'yes' : 'no';
  return `${btw}_${keuring}`;
}

function _formatEuros(v) {
  return Number(v || 0).toLocaleString('nl-BE', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
}
function _formatDate(d) {
  return d.toLocaleDateString('nl-BE', { day: 'numeric', month: 'short', year: 'numeric' });
}

function _bindOfferteDropZone(projectId, configType) {
  const zone  = document.getElementById('offerteDropZone');
  const input = document.getElementById('offerteFileInput');
  const err   = document.getElementById('offerteUploadError');
  const prog  = document.getElementById('offerteUploadProgress');
  if (!zone || !input) return;

  zone.addEventListener('click', () => input.click());
  input.addEventListener('change', () => {
    if (input.files && input.files[0]) _handleOfferteFile(input.files[0], projectId, configType);
  });
  zone.addEventListener('dragover',  (e) => { e.preventDefault(); zone.classList.add('drag-over'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
  zone.addEventListener('drop', (e) => {
    e.preventDefault();
    zone.classList.remove('drag-over');
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) _handleOfferteFile(f, projectId, configType);
  });

  async function _handleOfferteFile(file, projectId, configType) {
    err.style.display = 'none'; err.textContent = '';
    try {
      if (file.type !== 'application/pdf') throw new Error('Enkel PDF-bestanden');
      if (file.size > 10 * 1024 * 1024)    throw new Error('PDF is groter dan 10 MB');
      prog.style.display = 'block';
      prog.querySelector('span').textContent = '…';
      await uploadProjectOfferte(projectId, configType, file);
      closeOfferteModal();
      await _refreshCurrentDrawer();
    } catch (e) {
      err.textContent = e.message || String(e);
      err.style.display = 'block';
      prog.style.display = 'none';
    }
  }
}

async function _refreshCurrentDrawer() {
  if (!_currentDrawerProject) return;
  const id = _currentDrawerProject.id;
  const snap = await firebase.firestore().collection('projects').doc(id).get();
  if (!snap.exists) return;
  const fresh = mergeProjectMetadata(Object.assign({ id: snap.id }, snap.data()));
  _currentDrawerProject = fresh;
  renderDrawer(fresh);
}

function openDrawer(projectId) {
  _drawerProjectId = projectId;
  const drawerEl = document.getElementById('drawer');
  const body     = document.getElementById('drawerBody');
  const header   = document.getElementById('drawerHeader');

  body.innerHTML   = '<p class="sp-empty-state">⏳ Laden…</p>';
  header.innerHTML = `
    <div class="flex-grow-1">
      <h5 class="offcanvas-title mb-0" id="drawerHeaderTitle">…</h5>
    </div>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Sluit"></button>
  `;

  bootstrap.Offcanvas.getOrCreateInstance(drawerEl).show();

  getProject(projectId).then(project => {
    if (!project || project.deletedAt) {
      body.innerHTML = '<div class="alert alert-danger">Project niet gevonden of verwijderd.</div>';
      return;
    }
    _currentDrawerProject = project;
    renderDrawer(project);
    // Load comments + photos in parallel.
    return Promise.all([
      listComments(projectId).catch(e => { console.warn('listComments failed', e); return []; }),
      listProjectPhotos(projectId).catch(e => { console.warn('listProjectPhotos failed', e); return []; }),
    ]).then(([comments, photos]) => {
      renderComments(project, comments);
      renderPhotos(project, photos);
      // Mark read (non-blocking). Refresh list so the pulse dot disappears.
      markCommentsRead(projectId).then(() => {
        setTimeout(refreshProjectList, 400);
      }).catch(err => console.warn('markCommentsRead failed', err));
    });
  }).catch(e => {
    body.innerHTML = `<div class="alert alert-danger">Kon project niet laden: ${escapeHtml(e && e.message ? e.message : String(e))}</div>`;
  });
}

function closeDrawer() {
  const el = document.getElementById('drawer');
  bootstrap.Offcanvas.getOrCreateInstance(el).hide();
}

// Reset drawer state when Bootstrap hides it (backdrop click, Escape key, data-bs-dismiss)
document.addEventListener('DOMContentLoaded', () => {
  const drawerEl = document.getElementById('drawer');
  if (drawerEl) {
    drawerEl.addEventListener('hidden.bs.offcanvas', () => {

      _currentDrawerProject = null;

});

function renderDrawerOffertes(project) {
  const types = (project.lastCalcRun && project.lastCalcRun.inputs && Array.isArray(project.lastCalcRun.inputs.selectedConfigTypes))
    ? project.lastCalcRun.inputs.selectedConfigTypes : [];
  const offertes  = project.offertes || {};
  const dismissed = new Set(project.dismissedConfigs || []);
  if (types.length === 0) return '';

  const active   = types.filter(t => !dismissed.has(t));
  const inactive = types.filter(t =>  dismissed.has(t));

  const activeRows = active.map(t => {
    const cfg = _findConfigByType(project, t);
    const pdf = offertes[t];
    const iconState = pdf
      ? '<i class="fa-solid fa-circle-check icon-ok" aria-hidden="true"></i>'
      : '<i class="fa-solid fa-triangle-exclamation icon-warn" aria-hidden="true"></i>';
    const fileRow = pdf
      ? `<div class="offerte-row-pdf"><i class="fa-solid fa-file-pdf" aria-hidden="true"></i> ${escapeHtml(pdf.filename || '')}</div>`
      : `<div class="offerte-row-pdf" style="color:var(--muted);">Offerte nog niet toegevoegd</div>`;
    const actions = pdf
      ? `<button class="btn-icon offerte-download-btn" data-type="${escapeHtml(t)}" title="Download"><i class="fa-solid fa-download" aria-hidden="true"></i></button>
         <button class="btn-icon offerte-replace-btn"  data-type="${escapeHtml(t)}" title="Vervangen"><i class="fa-solid fa-pen-to-square" aria-hidden="true"></i></button>
         <button class="btn-icon offerte-trash-btn"    data-type="${escapeHtml(t)}" data-has-pdf="1" title="Verwijderen"><i class="fa-solid fa-trash" aria-hidden="true"></i></button>`
      : `<button class="btn-icon offerte-upload-btn"   data-type="${escapeHtml(t)}" title="Upload"><i class="fa-solid fa-upload" aria-hidden="true"></i></button>
         <button class="btn-icon offerte-trash-btn"    data-type="${escapeHtml(t)}" data-has-pdf="0" title="Niet geoffreerd"><i class="fa-solid fa-trash" aria-hidden="true"></i></button>`;

    return `
      <div class="offerte-row ${pdf ? 'has-pdf' : 'missing-pdf'}">
        <div class="offerte-row-head">
          ${iconState}
          <span class="offerte-row-title">${escapeHtml(cfg.type)} · ${escapeHtml(cfg.omschrijving || '')}</span>
        </div>
        <div class="offerte-row-meta">
          € ${_formatEuros(cfg.priceEur)}${cfg.batCap ? ' · ' + escapeHtml(String(cfg.batCap)) + ' kWh' : ''}${cfg.batInv ? ' · ' + escapeHtml(String(cfg.batInv)) + ' kW' : ''}
        </div>
        ${fileRow}
        <div class="offerte-row-actions">${actions}</div>
      </div>
    `;
  }).join('');

  const inactiveRows = inactive.length ? `
    <div class="offerte-divider">── Niet geoffreerd ──</div>
    ${inactive.map(t => {
      const cfg = _findConfigByType(project, t);
      return `
        <div class="offerte-row dismissed">
          <span class="offerte-row-title">${escapeHtml(cfg.type)} · ${escapeHtml(cfg.omschrijving || '')}</span>
          <button class="btn-icon offerte-restore-btn" data-type="${escapeHtml(t)}" title="Terugzetten">
            <i class="fa-solid fa-rotate-left" aria-hidden="true"></i>
          </button>
        </div>
      `;
    }).join('')}
  ` : '';

  return `
    <section class="border-bottom pb-3 mb-3 drawer-configs">
      <h6 class="mb-2 text-uppercase text-muted">Configs</h6>
      ${activeRows}
      ${inactiveRows}
    </section>
  `;
}

function renderDrawer(project) {
  const header = document.getElementById('drawerHeader');
  const body   = document.getElementById('drawerBody');

      <h5 class="offcanvas-title mb-0" id="drawerHeaderTitle">${escapeHtml(project.projectName || '(zonder naam)')}</h5>
      <div class="text-muted small mt-1">${escapeHtml(project.customerName || '')} · ${statusChipHTML(project.status, project.id)}</div>
    </div>
    <button type="button" class="btn-close ms-2" data-bs-dismiss="offcanvas" aria-label="Sluit"></button>
  `;

  // Build sections conditionally.
  const sections = [];

  if (needsGroundFaultCheck(project)) {
    sections.push(`
      <div class="alert alert-warning d-flex gap-2 mb-3">

        <div><strong>Controleer fase↔aarde meting voor Zendure.</strong>
          Nog niet aangevinkt in dit project. Meet het spanningsverschil vóór installatie en vink aan in <i class="fa-solid fa-pen-to-square" aria-hidden="true"></i> Bewerk project om een ground fault te voorkomen.</div>
      </div>

  if (needsOfferteWarning(project)) {
    const missingCount = (project.lastCalcRun && project.lastCalcRun.inputs && Array.isArray(project.lastCalcRun.inputs.selectedConfigTypes))
      ? project.lastCalcRun.inputs.selectedConfigTypes.filter(t => !(project.dismissedConfigs || []).includes(t) && !(project.offertes || {})[t]).length
      : 0;
    sections.push(`
      <div class="alert alert-warning d-flex gap-2 mb-3">
        <i class="fa-solid fa-triangle-exclamation icon-warn flex-shrink-0 mt-1" aria-hidden="true"></i>
        <div>
          <strong>Offertes ontbreken.</strong>
          Dit project staat in offerte-fase maar ${missingCount} config(s) hebben nog geen offerte PDF.

  // Contact

  if (m.customer.phone)   contactLines.push(`<div class="mb-1">📞 <a href="tel:${escapeHtml(m.customer.phone)}">${escapeHtml(m.customer.phone)}</a></div>`);
  if (m.customer.email)   contactLines.push(`<div class="mb-1">✉️ <a href="mailto:${escapeHtml(m.customer.email)}">${escapeHtml(m.customer.email)}</a></div>`);
  if (contactLines.length > 0) {
    sections.push(`
      <section class="border-bottom pb-3 mb-3">
        <h6 class="mb-2 text-uppercase text-muted">Contact</h6>
        ${contactLines.join('')}
      </section>
    `);
  }

  // Actions
  const calcHref = project.lastCalcRun && project.lastCalcRun.calculatedAt
    ? `index.html?project=${project.id}#results`
    : `index.html?project=${project.id}`;
  sections.push(`
    <section class="border-bottom pb-3 mb-3">
      <div class="d-grid d-md-flex gap-2">
        <a class="btn btn-primary flex-md-grow-1" href="${calcHref}"><i class="fa-solid fa-calculator me-1" aria-hidden="true"></i> Open berekening</a>
        <a class="btn btn-outline-primary flex-md-grow-1" href="project-edit.html?project=${project.id}"><i class="fa-solid fa-pen-to-square me-1" aria-hidden="true"></i> Bewerk project</a>
        <button type="button" class="btn btn-outline-danger flex-md-grow-1" id="drawerDeleteBtn"><i class="fa-solid fa-trash me-1" aria-hidden="true"></i> Verwijderen</button>
      </div>
    </section>
  `);

  // Configs / offertes per type
  sections.push(renderDrawerOffertes(project));

  // Situation
  if (m.situation) {
    sections.push(`
      <section class="border-bottom pb-3 mb-3">
        <h6 class="mb-2 text-uppercase text-muted">Situatie</h6>
        <div style="white-space:pre-wrap;font-size:0.92rem;line-height:1.4;">${escapeHtml(m.situation)}</div>
      </section>
    `);
  }
  // Notes
  if (m.notes) {
    sections.push(`
      <section class="border-bottom pb-3 mb-3">
        <h6 class="mb-2 text-uppercase text-muted">Notities</h6>
        <div style="white-space:pre-wrap;font-size:0.92rem;line-height:1.4;">${escapeHtml(m.notes)}</div>
      </section>
    `);
  }

  // Photos placeholder (filled by renderPhotos after async listProjectPhotos)
  sections.push(`
    <section class="border-bottom pb-3 mb-3" id="drawerPhotosSection">
      <h6 class="mb-2 text-uppercase text-muted"><i class="fa-solid fa-images" aria-hidden="true"></i> Foto's <span id="drawerPhotosCount" class="text-muted fw-normal"></span></h6>

      <div class="d-flex align-items-center gap-2 mt-2">
        <input type="file" id="drawerPhotoInput" accept="image/*" multiple class="form-control form-control-sm" />
        <button type="button" class="btn btn-sm btn-outline-secondary" id="drawerPhotoUploadBtn">📤 Upload</button>
      </div>
      <div class="text-danger small mt-1" id="drawerPhotoErr"></div>
    </section>
  `);

  // Comments placeholder (filled by renderComments)
  sections.push(`
    <section id="drawerCommentsSection">
      <h6 class="mb-2 text-uppercase text-muted"><i class="fa-solid fa-comments" aria-hidden="true"></i> Opmerkingen <span id="drawerCommentsCount" class="text-muted fw-normal"></span></h6>
      <div class="d-flex flex-column gap-2 mb-3" id="drawerCommentsList"><p class="sp-empty-state">⏳ Laden…</p></div>
      <div class="input-group mt-2">
        <textarea id="drawerCommentInput" class="form-control" rows="2" placeholder="Opmerking toevoegen…" maxlength="4000"></textarea>

      </div>
      <div class="text-danger small mt-1" id="drawerCommentErr"></div>
    </section>

  body.innerHTML = sections.join('');

  // Wire delete button (soft-delete from drawer)
  const delBtn = document.getElementById('drawerDeleteBtn');
  if (delBtn) {
    delBtn.addEventListener('click', async () => {
      if (!confirm('Project verwijderen? Het wordt soft-deleted en blijft herstelbaar via "Toon verwijderde".')) return;
      try {
        await softDeleteProject(project.id);
        closeDrawer();
        await refreshProjectList();
      } catch (err) {
        alert('Verwijderen mislukt: ' + (err && err.message ? err.message : err));
      }
    });
  }

  // Wire photo upload
  document.getElementById('drawerPhotoUploadBtn').addEventListener('click', async () => {
    const input = document.getElementById('drawerPhotoInput');
    const errEl = document.getElementById('drawerPhotoErr');
    errEl.textContent = '';
    const files = Array.from(input.files || []);
    if (!files.length) { errEl.textContent = 'Kies eerst een foto.'; return; }
    const btn = document.getElementById('drawerPhotoUploadBtn');
    btn.disabled = true; btn.textContent = 'Uploaden…';
    try {
      for (const f of files) {
        try { await uploadProjectPhoto(project.id, f); }
        catch (e) { errEl.textContent = e && e.message ? e.message : String(e); break; }
      }
      input.value = '';
      const fresh = await listProjectPhotos(project.id);
      renderPhotos(project, fresh);
    } finally {
      btn.disabled = false; btn.textContent = '📤 Upload';
    }
  });

  // Wire comment submit
  document.getElementById('drawerCommentSubmit').addEventListener('click', async () => {
    const errEl = document.getElementById('drawerCommentErr');
    const btn   = document.getElementById('drawerCommentSubmit');
    const input = document.getElementById('drawerCommentInput');
    errEl.textContent = '';
    const text = input.value;
    if (!text.trim()) { errEl.textContent = 'Leeg.'; return; }
    btn.disabled = true; btn.textContent = 'Bezig…';
    try {
      await addComment(project.id, text);
      input.value = '';
      // Refresh comments list
      const fresh = await listComments(project.id);
      renderComments(project, fresh);
    } catch (e) {
      errEl.textContent = e && e.message ? e.message : String(e);
    } finally {
      btn.disabled = false; btn.textContent = 'Versturen';
    }
  });
}

function renderComments(project, comments) {
  const list = document.getElementById('drawerCommentsList');
  const count = document.getElementById('drawerCommentsCount');
  if (!list) return;
  count.textContent = comments.length > 0 ? `(${comments.length})` : '';
  if (comments.length === 0) {
    list.innerHTML = '<p class="sp-empty-state">Nog geen opmerkingen. Plaats er één hieronder.</p>';
    return;
  }
  list.innerHTML = comments.map(c => `
    <div class="bg-light rounded p-2">
      <div class="d-flex justify-content-between gap-2 mb-1">
        <span class="fw-semibold text-primary-emphasis small">${escapeHtml(shortName(c.author))}</span>
        <span class="text-muted small">${fmtRelTime(c.createdAt)}</span>
      </div>
      <div style="white-space:pre-wrap;font-size:0.92rem;line-height:1.35;">${escapeHtml(c.text || '')}</div>
    </div>
  `).join('');
  // Scroll last comment into view if the newest is below the fold.
  const lastComment = list.lastElementChild;
  if (lastComment) lastComment.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// Photos rendering + lightbox ------------------------------------------------
let _drawerPhotos = [];

  _drawerPhotos = photos || [];

  count.textContent = _drawerPhotos.length > 0 ? `(${_drawerPhotos.length})` : '';

    grid.innerHTML = '<p class="sp-empty-state">Nog geen foto’s geüpload.</p>';

    return `<div class="photo-tile" data-idx="${i}"><img src="${p.downloadUrl}" alt="${escapeHtml(p.name || '')}" /></div>`;

function openLightbox(idx) {
  _lightboxIdx = idx;
  let lb = document.getElementById('dashLightbox');
  if (!lb) {
    lb = document.createElement('div');
    lb.id = 'dashLightbox';
    lb.className = 'sp-lightbox';
    lb.innerHTML = `
      <button type="button" class="sp-lightbox-btn close" title="Sluit">×</button>
      <button type="button" class="sp-lightbox-btn prev" title="Vorige">‹</button>
      <button type="button" class="sp-lightbox-btn next" title="Volgende">›</button>
      <button type="button" class="sp-lightbox-btn del" title="Verwijder foto"><i class="fa-solid fa-trash" aria-hidden="true"></i></button>
      <img id="dashLightboxImg" alt="" />
    `;
    document.body.appendChild(lb);
    lb.querySelector('.close').addEventListener('click', closeLightbox);
    lb.querySelector('.prev').addEventListener('click', e => { e.stopPropagation(); navLightbox(-1); });
    lb.querySelector('.next').addEventListener('click', e => { e.stopPropagation(); navLightbox(+1); });
    lb.querySelector('.del').addEventListener('click', async e => {
      e.stopPropagation();
      const photo = _drawerPhotos[_lightboxIdx];
      if (!photo) return;
      if (!confirm('Deze foto verwijderen?')) return;
      try {
        await deleteProjectPhoto(_drawerProjectId, photo.id, photo.storagePath);
        const fresh = await listProjectPhotos(_drawerProjectId);
        renderPhotos(null, fresh);
        if (fresh.length === 0) closeLightbox();
        else { _lightboxIdx = Math.min(_lightboxIdx, fresh.length - 1); refreshLightboxImage(); }
      } catch (err) {
        alert('Verwijderen mislukt: ' + (err && err.message ? err.message : err));
      }
    });
    lb.addEventListener('click', e => { if (e.target === lb) closeLightbox(); });
    document.addEventListener('keydown', e => {
      if (!lb.classList.contains('open')) return;
      if (e.key === 'Escape') closeLightbox();
      else if (e.key === 'ArrowLeft')  navLightbox(-1);
      else if (e.key === 'ArrowRight') navLightbox(+1);
    });
  }
  refreshLightboxImage();
  lb.classList.add('open');
}

function refreshLightboxImage() {
  const img = document.getElementById('dashLightboxImg');
  const photo = _drawerPhotos[_lightboxIdx];
  if (img && photo && photo.downloadUrl) img.src = photo.downloadUrl;
}

function navLightbox(delta) {
  if (!_drawerPhotos.length) return;
  _lightboxIdx = (_lightboxIdx + delta + _drawerPhotos.length) % _drawerPhotos.length;
  refreshLightboxImage();
}

function closeLightbox() {
  const lb = document.getElementById('dashLightbox');
  if (lb) lb.classList.remove('open');
}

// Offerte-row button delegation (inside drawer)
(function bindOfferteRowActions() {
  const drawer = document.getElementById('drawer');
  if (!drawer) return;
  drawer.addEventListener('click', async (e) => {
    const btn = e.target.closest('button.btn-icon');
    if (!btn) return;
    const type = btn.getAttribute('data-type');
    const project = _currentDrawerProject;
    if (!project || !type) return;

    try {
      if (btn.classList.contains('offerte-upload-btn') || btn.classList.contains('offerte-replace-btn')) {
        openOfferteModal(project, type);
      }
      else if (btn.classList.contains('offerte-download-btn')) {
        const pdf = (project.offertes || {})[type];
        if (!pdf || !pdf.storagePath) return;
        const url = await firebase.storage().ref(pdf.storagePath).getDownloadURL();
        window.open(url, '_blank');
      }
      else if (btn.classList.contains('offerte-trash-btn')) {
        const hasPdf = btn.getAttribute('data-has-pdf') === '1';
        if (hasPdf) {
          if (!confirm('Je verwijdert ook de bijgevoegde offerte PDF. Zeker?')) return;
          await hardDeleteProjectConfig(project.id, type);
        } else {
          await dismissProjectConfig(project.id, type);
        }
        await _refreshCurrentDrawer();
      }
      else if (btn.classList.contains('offerte-restore-btn')) {
        await restoreProjectConfig(project.id, type);
        await _refreshCurrentDrawer();
      }
    } catch (err) {
      alert('Er ging iets mis: ' + (err.message || err));
    }
  });
})();

// Status-dropdown delegation (Bootstrap dropdown-items for status change)
document.addEventListener('click', (ev) => {
  const opt = ev.target.closest('.dropdown-menu .dropdown-item[data-status][data-project-id]');
  if (!opt) return;
  const statusKey = opt.getAttribute('data-status');
  const projectId = opt.getAttribute('data-project-id');
  updateProjectStatus(projectId, statusKey).then(() => refreshProjectList()).catch(err => {
    alert('Kon status niet wijzigen: ' + (err && err.message ? err.message : err));
  });
});

// Responsive view: re-render on breakpoint cross (992px)
let _wasDesktop = window.innerWidth >= 992;
window.addEventListener('resize', () => {
  const nowDesktop = window.innerWidth >= 992;
  if (nowDesktop !== _wasDesktop) {
    _wasDesktop = nowDesktop;
    renderCurrent();
  }
});
</script>
