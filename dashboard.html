<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <title>SmartPeak — Projecten</title>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-storage-compat.js"></script>
  <script src="assets/js/csv.js"></script>
  <script src="assets/js/firebase-init.js"></script>
  <style>
    :root {
      --primary: #2c7be5;
      --primary-dark: #1a5fba;
      --success: #00b478;
      --warning: #f6a623;
      --danger: #e54545;
      --bg: #f0f4fb;
      --card: #ffffff;
      --border: #dce3f0;
      --text: #1e2a3a;
      --muted: #6b7a99;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 16px;
    }
    h1 { font-size: 1.7rem; font-weight: 700; color: var(--primary-dark); margin-bottom: 4px; }
    h2 { font-size: 1.2rem; font-weight: 600; color: var(--primary-dark); margin-bottom: 12px; }
    .subtitle { color: var(--muted); font-size: 0.95rem; margin-bottom: 16px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(44, 123, 229, 0.06);
    }
    .center-card {
      max-width: 480px;
      margin: 80px auto;
      text-align: center;
    }
    .btn {
      display: inline-block;
      padding: 10px 20px;
      border-radius: 8px;
      border: 0;
      background: var(--primary);
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }
    .btn:hover { background: var(--primary-dark); }
    .btn-secondary { background: transparent; color: var(--primary); border: 1px solid var(--primary); }
    .btn-secondary:hover { background: #eef4ff; }
    .btn-danger { background: var(--danger); }
    .btn-danger:hover { background: #b02a2a; }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }
    .topbar .right { display: flex; align-items: center; gap: 12px; color: var(--muted); }

    .toolbar { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }

    .alert {
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 0.92rem;
      margin-bottom: 16px;
    }
    .alert-warning { background: #fff8ec; border: 1px solid #f6a623; color: #7a5000; }
    .alert-info    { background: #eef4ff; border: 1px solid #2c7be5; color: #1a3a6e; }
    .alert-error   { background: #fde8e8; border: 1px solid #e54545; color: #7a1010; }

    .hide { display: none !important; }

    table.project-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.92rem;
    }
    table.project-table th,
    table.project-table td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: middle;
    }
    table.project-table thead th {
      background: var(--bg);
      color: var(--muted);
      font-weight: 600;
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    table.project-table tr:last-child td { border-bottom: none; }
    table.project-table tr.deleted-row { opacity: 0.5; }

    .status-chip {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 0.82rem;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    .status-chip.readonly { cursor: default; }
    .status-chip.editable:hover { filter: brightness(1.08); }
    .status-popover {
      position: absolute;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
      padding: 4px 0;
      z-index: 50;
      min-width: 220px;
      max-height: 360px;
      overflow-y: auto;
    }
    .status-popover .status-option {
      padding: 6px 12px;
      cursor: pointer;
      font-size: 0.88rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-popover .status-option:hover { background: var(--bg); }
    .status-popover .status-dot {
      width: 10px; height: 10px; border-radius: 50%;
    }

    .row-actions {
      display: flex;
      gap: 6px;
    }
    .row-actions button {
      background: transparent;
      border: 0;
      cursor: pointer;
      font-size: 1.05rem;
      padding: 4px 8px;
      border-radius: 6px;
    }
    .row-actions button:hover { background: var(--bg); }

    #projectList .empty-state {
      color: var(--muted);
      font-style: italic;
      padding: 24px 8px;
    }

    /* Project-name button (opens drawer) */
    .projectNameBtn {
      background: transparent; border: 0; padding: 0;
      color: var(--primary); font-weight: 600; font-size: 0.95rem;
      cursor: pointer; text-align: left;
    }
    .projectNameBtn:hover { text-decoration: underline; }

    /* Chat-indicator naast projectnaam. Altijd getoond als er opmerkingen zijn;
       pulse alleen bij ongelezen van de tegenpartij. */
    .chat-indicator {
      display: inline-block;
      margin-right: 6px;
      font-size: 0.95rem;
      opacity: 0.55;
    }
    .chat-indicator.unread {
      opacity: 1;
      animation: chat-pulse 1.6s ease-in-out infinite;
    }
    @keyframes chat-pulse {
      0%, 100% { transform: scale(1);    opacity: 1;   }
      50%      { transform: scale(1.15); opacity: 0.6; }
    }
    /* Ground-fault warning icon (row + drawer) */
    .row-warning {
      display: inline-block;
      margin-right: 6px;
      color: var(--warning);
      font-size: 0.95rem;
      cursor: help;
    }

    /* Photo grid in drawer */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 6px;
      margin-bottom: 10px;
    }
    .photo-tile {
      aspect-ratio: 1 / 1;
      overflow: hidden;
      border-radius: 6px;
      background: var(--bg);
      cursor: zoom-in;
      position: relative;
    }
    .photo-tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .photo-tile.broken { display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 0.72rem; text-align: center; padding: 4px; cursor: help; }
    .photo-uploader { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    .photo-uploader input[type=file] { flex: 1; font-size: 0.85rem; }

    /* Lightbox (re-usable with producten.html pattern) */
    .lightbox-dash {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.92);
      display: none;
      align-items: center; justify-content: center;
      z-index: 300;
      padding: 24px;
    }
    .lightbox-dash.open { display: flex; }
    .lightbox-dash img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 6px; }
    .lightbox-dash-btn {
      position: absolute;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      width: 44px; height: 44px; border-radius: 50%;
      font-size: 1.4rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .lightbox-dash-btn:hover { background: rgba(255, 255, 255, 0.25); }
    .lightbox-dash .close { top: 14px; right: 14px; }
    .lightbox-dash .prev  { left: 14px;  top: 50%; transform: translateY(-50%); }
    .lightbox-dash .next  { right: 14px; top: 50%; transform: translateY(-50%); }
    .lightbox-dash .del   { bottom: 14px; right: 14px; background: rgba(229,69,69,0.85); }
    .lightbox-dash .del:hover { background: rgba(229,69,69,1); }

    /* Drawer + overlay */
    .drawer-overlay {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.35);
      opacity: 0; pointer-events: none;
      transition: opacity 0.18s ease-out;
      z-index: 200;
    }
    .drawer-overlay.open {
      opacity: 1; pointer-events: auto;
    }
    .drawer {
      position: fixed; top: 0; right: 0; bottom: 0;
      width: 420px; max-width: 100vw;
      background: var(--card);
      border-left: 1px solid var(--border);
      box-shadow: -4px 0 24px rgba(0, 0, 0, 0.08);
      transform: translateX(100%);
      transition: transform 0.22s ease-out;
      z-index: 201;
      display: flex; flex-direction: column;
    }
    .drawer.open { transform: translateX(0); }
    @media (max-width: 900px) {
      .drawer { width: 100vw; }
    }
    .drawer-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: flex-start; gap: 10px;
      position: sticky; top: 0; background: var(--card); z-index: 1;
    }
    .drawer-header h2 { font-size: 1.1rem; margin: 0; color: var(--text); }
    .drawer-header .meta { flex: 1; }
    .drawer-header .meta .customer { font-size: 0.88rem; color: var(--muted); margin-top: 2px; }
    .drawer-close-btn {
      background: transparent; border: 0; cursor: pointer;
      font-size: 1.4rem; color: var(--muted); padding: 0 4px;
      line-height: 1;
    }
    .drawer-close-btn:hover { color: var(--text); }
    .drawer-body {
      flex: 1; overflow-y: auto;
      padding: 16px 20px;
    }
    .drawer-section {
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }
    .drawer-section:last-child { border-bottom: 0; margin-bottom: 0; }
    .drawer-section h3 {
      font-size: 0.78rem; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.06em;
      margin-bottom: 8px;
    }
    .drawer-section .free-text {
      white-space: pre-wrap; font-size: 0.92rem; color: var(--text); line-height: 1.4;
    }
    .contact-line { font-size: 0.92rem; margin-bottom: 4px; }
    .contact-line a { color: var(--primary); text-decoration: none; }
    .contact-line a:hover { text-decoration: underline; }
    .drawer-actions {
      display: flex; gap: 8px; flex-wrap: wrap;
    }
    .drawer-actions .btn {
      flex: 1 1 auto; min-width: 140px;
      justify-content: center; font-size: 0.9rem; padding: 8px 12px;
    }

    /* Comments thread */
    .comments-list {
      display: flex; flex-direction: column; gap: 8px;
      margin-bottom: 12px;
    }
    .comment {
      background: var(--bg);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.92rem;
    }
    .comment .meta {
      font-size: 0.78rem; color: var(--muted);
      margin-bottom: 3px;
      display: flex; justify-content: space-between; gap: 8px;
    }
    .comment .meta .author { font-weight: 600; color: var(--primary-dark); }
    .comment .text { white-space: pre-wrap; line-height: 1.35; }
    .composer { display: flex; flex-direction: column; gap: 8px; }
    .composer textarea {
      width: 100%;
      border: 1px solid var(--border); border-radius: 8px;
      padding: 8px 10px; font: inherit; font-size: 0.92rem;
      resize: vertical; min-height: 70px; background: #f7f9fd;
    }
    .composer textarea:focus { outline: none; border-color: var(--primary); background: #fff; }
    .composer .composer-row {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .composer .composer-row .err { color: var(--danger); font-size: 0.82rem; flex: 1; }

    .configs-summary { font-size: 0.92rem; }
    .configs-summary li { margin-left: 18px; margin-bottom: 3px; }

    /* Dashboard toolbar + filters */
    .toolbar {
      display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
      margin-bottom: 14px;
    }
    .toolbar .filler { flex: 1; }
    .toolbar input[type=search] {
      border: 1px solid var(--border); border-radius: 8px;
      padding: 6px 10px; font: inherit; font-size: 0.9rem;
      background: #fff; min-width: 180px;
    }
    .toolbar input[type=search]:focus { outline: none; border-color: var(--primary); }
    .toolbar label.filter-chk {
      display: flex; align-items: center; gap: 6px;
      color: var(--muted); font-size: 0.88rem; cursor: pointer;
    }
    .toolbar .view-toggle {
      display: inline-flex; border: 1px solid var(--border); border-radius: 8px;
      overflow: hidden; background: #fff;
    }
    .toolbar .view-toggle button {
      background: transparent; border: 0; padding: 6px 12px;
      font: inherit; font-size: 0.88rem; cursor: pointer; color: var(--muted);
    }
    .toolbar .view-toggle button.active {
      background: var(--primary); color: #fff;
    }

    /* Kanban board */
    .kanban-board {
      display: grid;
      grid-template-columns: repeat(5, minmax(210px, 1fr));
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 6px;
    }
    @media (max-width: 1100px) {
      .kanban-board { grid-template-columns: repeat(5, 230px); }
    }
    .kanban-col {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      min-height: 200px;
      display: flex; flex-direction: column;
      transition: background 0.12s, outline 0.12s;
    }
    .kanban-col.drag-over {
      background: rgba(44, 123, 229, 0.08);
      outline: 2px dashed var(--primary);
      outline-offset: -4px;
    }
    .kanban-col-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 10px; font-weight: 700; font-size: 0.85rem;
      text-transform: uppercase; letter-spacing: 0.04em;
    }
    .kanban-col-header .phase-dot {
      display: inline-block; width: 10px; height: 10px; border-radius: 50%;
      margin-right: 6px; vertical-align: middle;
    }
    .kanban-col-header .count {
      color: var(--muted); font-weight: 600; font-size: 0.82rem;
    }
    .kanban-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 10px;
      margin-bottom: 8px;
      cursor: grab;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    .kanban-card:hover { border-color: var(--primary); }
    .kanban-card:active { cursor: grabbing; }
    .kanban-card.dragging { opacity: 0.5; }
    .kanban-card-title { font-weight: 600; font-size: 0.92rem; margin-bottom: 2px; color: var(--primary-dark); cursor: pointer; }
    .kanban-card-title:hover { text-decoration: underline; }
    .kanban-card-customer { font-size: 0.82rem; color: var(--muted); margin-bottom: 6px; }
    .kanban-card-footer { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

    .permdelBtn { color: var(--danger); }

    .icon-ok    { color: #16a34a; }
    .icon-warn  { color: #f59e0b; }
    .icon-danger{ color: #dc2626; }

    /* generic modal */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.45);
      display: none; align-items: center; justify-content: center;
      z-index: 200;
      padding: 20px;
    }
    .modal-overlay.open { display: flex; }
    .modal-dialog {
      background: #fff; border-radius: 10px;
      max-width: 520px; width: 100%;
      max-height: 90vh; overflow: auto;
      box-shadow: 0 10px 40px rgba(0,0,0,.25);
      padding: 0;
    }
    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px; border-bottom: 1px solid var(--border, #e5e7eb);
    }
    .modal-header h3 { margin: 0; font-size: 1.05rem; }
    .modal-close-btn {
      background: transparent; border: 0; font-size: 1.2rem;
      cursor: pointer; color: var(--muted, #6b7280);
    }
    .modal-body { padding: 16px; }
    .modal-footer {
      padding: 12px 16px; border-top: 1px solid var(--border, #e5e7eb);
      display: flex; justify-content: flex-end; gap: 8px;
    }

  </style>
</head>
<body>

<!-- State 1: not logged in -->
<div class="card center-card" id="stateLoggedOut">
  <h1><i class="fa-solid fa-bolt" aria-hidden="true"></i> SmartPeak — Projecten</h1>
  <p class="subtitle">Alleen voor Bloxit medewerkers.</p>
  <button type="button" class="btn" id="btnSignIn">Log in met Google</button>
  <p id="signInError" class="alert alert-error hide" style="margin-top:16px;"></p>
</div>

<!-- State 2: logged in but not whitelisted -->
<div class="card center-card hide" id="stateNotWhitelisted">
  <h1><i class="fa-solid fa-triangle-exclamation icon-danger" aria-hidden="true"></i> Geen toegang</h1>
  <p class="subtitle">Je bent ingelogd als <strong id="notWhitelistedEmail">…</strong> maar dit account heeft geen toegang tot SmartPeak Projecten.</p>
  <button type="button" class="btn btn-secondary" id="btnSignOutNW">Uitloggen</button>
</div>

<!-- State 3: logged in + whitelisted -->
<div class="hide" id="stateAuthorized">
  <div class="topbar">
    <h1><i class="fa-solid fa-bolt" aria-hidden="true"></i> SmartPeak — Projecten</h1>
    <div class="right">
      <span>Hallo, <strong id="userDisplayName">…</strong></span>
      <button type="button" class="btn btn-secondary" id="btnSignOut">Uitloggen</button>
    </div>
  </div>

  <div class="card">
    <div class="toolbar">
      <button type="button" class="btn" id="btnNewProject">+ Nieuw project</button>
      <input type="search" id="projectSearch" placeholder="🔍 Zoek projectnaam of klant…" />
      <label class="filter-chk">
        <input type="checkbox" id="toggleShowFinished" /> Toon afgesloten
      </label>
      <label class="filter-chk">
        <input type="checkbox" id="toggleShowDeleted" /> Toon verwijderde
      </label>
      <div class="filler"></div>
      <div class="view-toggle" id="viewToggle">
        <button type="button" data-view="list"  class="active"><i class="fa-solid fa-list" aria-hidden="true"></i> Lijst</button>
        <button type="button" data-view="board"><i class="fa-solid fa-table-columns" aria-hidden="true"></i> Bord</button>
      </div>
    </div>
    <div id="projectList">Project-lijst komt in Task 5.</div>
  </div>
</div>

<!-- Right-side drawer (opens on project-name click) -->
<div class="drawer-overlay" id="drawerOverlay"></div>
<aside class="drawer" id="drawer" aria-hidden="true" role="complementary">
  <div class="drawer-header" id="drawerHeader"></div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>

<div class="modal-overlay" id="offerteModal" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-header">
      <h3 id="offerteModalTitle">Offerte uploaden</h3>
      <button type="button" class="modal-close-btn" id="offerteModalClose" title="Sluiten">
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
    </div>
    <div class="modal-body" id="offerteModalBody">
      <!-- dynamisch ingevuld in Task 8 -->
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" id="offerteModalCancel">Annuleren</button>
    </div>
  </div>
</div>

<script>
// ─── ENTRY POINT ─────────────────────────────────────────────────────────────
function showState(which) {
  ['stateLoggedOut', 'stateNotWhitelisted', 'stateAuthorized'].forEach(id => {
    document.getElementById(id).classList.toggle('hide', id !== which);
  });
}

document.addEventListener('DOMContentLoaded', () => {
  // Wire sign-in button
  document.getElementById('btnSignIn').addEventListener('click', async () => {
    const errEl = document.getElementById('signInError');
    errEl.classList.add('hide');
    try {
      await signInWithGoogle();
      // onAuthStateChanged will pick up the new user and switch state.
    } catch (e) {
      errEl.textContent = 'Aanmelden mislukt: ' + (e && e.message ? e.message : e);
      errEl.classList.remove('hide');
    }
  });
  document.getElementById('btnSignOut').addEventListener('click', () => signOut());
  document.getElementById('btnSignOutNW').addEventListener('click', () => signOut());

  // New-project button → redirect to project-edit page.
  document.getElementById('btnNewProject').addEventListener('click', () => {
    window.location.href = 'project-edit.html?new=1';
  });

  // Listen for auth state changes
  onAuthStateChanged(user => {
    if (!user) {
      showState('stateLoggedOut');
      return;
    }
    if (!isWhitelisted(user)) {
      document.getElementById('notWhitelistedEmail').textContent = user.email || '(onbekend)';
      showState('stateNotWhitelisted');
      return;
    }
    document.getElementById('userDisplayName').textContent = user.displayName || user.email;
    showState('stateAuthorized');
    refreshProjectList();
  });

  document.getElementById('toggleShowDeleted').addEventListener('change', refreshProjectList);
  document.getElementById('toggleShowFinished').addEventListener('change', refreshProjectList);
  document.getElementById('projectSearch').addEventListener('input', () => {
    // Debounce: re-render only (already-loaded list) without re-fetching Firestore.
    renderCurrent();
  });
  // View toggle (Lijst / Bord). Remembers choice in localStorage.
  document.querySelectorAll('#viewToggle button').forEach(btn => {
    btn.addEventListener('click', () => {
      const v = btn.dataset.view;
      try { localStorage.setItem('smartpeak.dashboardView', v); } catch {}
      document.querySelectorAll('#viewToggle button').forEach(b => b.classList.toggle('active', b === btn));
      renderCurrent();
    });
  });
  // Restore view choice on load (default = bord).
  try {
    const saved = localStorage.getItem('smartpeak.dashboardView') || 'board';
    document.querySelectorAll('#viewToggle button').forEach(b => b.classList.toggle('active', b.dataset.view === saved));
  } catch {}
});

// ─── PROJECT LIST ───────────────────────────────────────────────────────────
function fmtDate(ts) {
  // ts = Firestore Timestamp
  if (!ts || typeof ts.toDate !== 'function') return '—';
  return ts.toDate().toLocaleDateString('nl-BE', { day: '2-digit', month: 'short', year: 'numeric' });
}

function shortName(email) {
  if (!email) return '—';
  return email.split('@')[0];
}

function statusChipHTML(statusKey, projectId) {
  const meta = getStatusMeta(statusKey);
  return `<span class="status-chip editable" data-status="${meta.key}" data-project-id="${projectId}" style="background:${meta.color};">${meta.label}</span>`;
}

let _openPopover = null;
function closeStatusPopover() {
  if (_openPopover) { _openPopover.remove(); _openPopover = null; }
}

function openStatusPopover(chip) {
  closeStatusPopover();
  const projectId = chip.dataset.projectId;
  const currentKey = chip.dataset.status;
  const pop = document.createElement('div');
  pop.className = 'status-popover';
  pop.innerHTML = PROJECT_STATUSES.map(s => `
    <div class="status-option" data-status="${s.key}">
      <span class="status-dot" style="background:${s.color}"></span>
      <span>${s.label}</span>
      ${s.key === currentKey ? '<span style="margin-left:auto;color:var(--muted);"><i class="fa-solid fa-check" aria-hidden="true"></i></span>' : ''}
    </div>
  `).join('');
  document.body.appendChild(pop);
  const rect = chip.getBoundingClientRect();
  pop.style.left = `${rect.left + window.scrollX}px`;
  pop.style.top  = `${rect.bottom + window.scrollY + 4}px`;
  _openPopover = pop;

  pop.querySelectorAll('.status-option').forEach(opt => {
    opt.addEventListener('click', async (e) => {
      e.stopPropagation();
      const newStatus = opt.dataset.status;
      closeStatusPopover();
      if (newStatus === currentKey) return;
      try {
        await updateProjectStatus(projectId, newStatus);
        await refreshProjectList();
      } catch (err) {
        alert('Kon status niet wijzigen: ' + (err && err.message ? err.message : err));
      }
    });
  });

  // Close on outside click
  setTimeout(() => {
    document.addEventListener('click', closeStatusPopover, { once: true });
  }, 0);
}

function rowHTML(p, isDeleted) {
  const updated = fmtDate(p.updatedAt);
  const by      = shortName(p.createdBy);
  const editBtn = isDeleted
    ? ''
    : `<button type="button" class="editBtn" data-id="${p.id}" title="Bewerken"><i class="fa-solid fa-pen-to-square" aria-hidden="true"></i></button>`;
  const calcBtn = (!isDeleted && p.lastCalcRun && p.lastCalcRun.calculatedAt)
    ? `<button type="button" class="calcBtn" data-id="${p.id}" title="Open berekening"><i class="fa-solid fa-calculator" aria-hidden="true"></i></button>`
    : '';
  const action  = isDeleted
    ? `<button type="button" class="restoreBtn"  data-id="${p.id}" title="Herstellen"><i class="fa-solid fa-rotate-left" aria-hidden="true"></i></button>
       <button type="button" class="permdelBtn"  data-id="${p.id}" data-name="${escapeHtml(p.projectName || '')}" title="Definitief verwijderen"><i class="fa-solid fa-circle-xmark icon-danger" aria-hidden="true"></i></button>`
    : `<button type="button" class="deleteBtn"   data-id="${p.id}" title="Verwijderen"><i class="fa-solid fa-trash" aria-hidden="true"></i></button>`;
  const email  = currentUserEmail();
  const chat   = hasAnyComments(p)
    ? `<span class="chat-indicator ${hasUnreadComments(p, email) ? 'unread' : ''}" title="${hasUnreadComments(p, email) ? 'Nieuwe opmerking(en) van collega' : 'Opmerkingen aanwezig'}"><i class="fa-solid fa-comment-dots" aria-hidden="true"></i></span>`
    : '';
  const warn   = needsGroundFaultCheck(p)
    ? `<span class="row-warning" title="Controleer fase↔aarde spanning: bij Zendure-installaties moet dit &lt; 30 V zijn. Zet de vink in het project zodra gemeten."><i class="fa-solid fa-triangle-exclamation icon-danger" aria-hidden="true"></i></span>`
    : '';
  return `
    <tr class="${isDeleted ? 'deleted-row' : ''}">
      <td>${chat}${warn}<button type="button" class="projectNameBtn" data-id="${p.id}">${escapeHtml(p.projectName || '')}</button></td>
      <td>${escapeHtml(p.customerName || '')}</td>
      <td>${statusChipHTML(p.status, p.id)}</td>
      <td>${updated}</td>
      <td>${by}</td>
      <td class="row-actions">
        ${calcBtn}
        ${editBtn}
        ${action}
      </td>
    </tr>`;
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

// Cached list of projects from Firestore. Filtering + render happens on this cache.
let _projectsCache = { active: [], deleted: [] };

async function refreshProjectList() {
  const el = document.getElementById('projectList');
  el.innerHTML = '<p class="empty-state">⏳ Laden…</p>';
  const showDeleted = document.getElementById('toggleShowDeleted').checked;
  try {
    _projectsCache.active  = await listActiveProjects();
    _projectsCache.deleted = showDeleted ? await listDeletedProjects() : [];
    renderCurrent();
  } catch (e) {
    el.innerHTML = `<div class="alert alert-error">Kon projecten niet laden: ${escapeHtml(e && e.message ? e.message : String(e))}</div>`;
  }
}

// Apply filters (search + show-finished) to the cached projects and render in the
// currently-active view mode (list or board).
function renderCurrent() {
  const el = document.getElementById('projectList');
  const searchQ = (document.getElementById('projectSearch').value || '').trim().toLowerCase();
  const showFinished = document.getElementById('toggleShowFinished').checked;

  const matchesFilters = p => {
    if (!p.deletedAt && !showFinished && FINISHED_STATUSES.includes(p.status)) return false;
    if (searchQ) {
      const hay = ((p.projectName || '') + ' ' + (p.customerName || '')).toLowerCase();
      if (!hay.includes(searchQ)) return false;
    }
    return true;
  };

  const active  = _projectsCache.active.filter(matchesFilters);
  const deleted = _projectsCache.deleted.filter(matchesFilters);

  if (active.length + deleted.length === 0) {
    el.innerHTML = '<p class="empty-state">Geen projecten die voldoen aan de filters.</p>';
    return;
  }

  const viewMode = (localStorage.getItem('smartpeak.dashboardView') || 'board');
  if (viewMode === 'board') {
    renderBoard(active, el);
  } else {
    renderList(active, deleted, el);
  }
}

function renderList(active, deleted, el) {
  const rows = [
    ...active.map(p => rowHTML(p, false)),
    ...deleted.map(p => rowHTML(p, true)),
  ].join('');
  el.innerHTML = `
    <table class="project-table">
      <thead><tr>
        <th>Project</th><th>Klant</th><th>Status</th><th>Bijgewerkt</th><th>Door</th><th></th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
  wireRowActions(el);
}

function renderBoard(active, el) {
  // Only non-deleted projects in the board view.
  const byPhase = new Map(PROJECT_PHASES.map(p => [p.key, []]));
  for (const proj of active) {
    const phase = phaseForStatus(proj.status);
    byPhase.get(phase.key).push(proj);
  }
  el.innerHTML = `
    <div class="kanban-board">
      ${PROJECT_PHASES.map(phase => {
        const items = byPhase.get(phase.key);
        return `
          <div class="kanban-col" data-phase="${phase.key}">
            <div class="kanban-col-header">
              <span><span class="phase-dot" style="background:${phase.color};"></span>${phase.label}</span>
              <span class="count">${items.length}</span>
            </div>
            <div class="kanban-col-body">
              ${items.map(p => kanbanCardHTML(p)).join('') || '<p class="empty-state" style="font-size:0.82rem;color:var(--muted);">—</p>'}
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;
  wireBoard(el);
}

function kanbanCardHTML(p) {
  const email = currentUserEmail();
  const chat  = hasAnyComments(p)
    ? `<span class="chat-indicator ${hasUnreadComments(p, email) ? 'unread' : ''}" title="${hasUnreadComments(p, email) ? 'Nieuwe opmerking(en)' : 'Opmerkingen aanwezig'}"><i class="fa-solid fa-comment-dots" aria-hidden="true"></i></span>`
    : '';
  const warn  = needsGroundFaultCheck(p)
    ? `<span class="row-warning" title="Controleer fase↔aarde meting bij Zendure (&lt; 30 V)."><i class="fa-solid fa-triangle-exclamation icon-danger" aria-hidden="true"></i></span>`
    : '';
  return `
    <div class="kanban-card" draggable="true" data-id="${p.id}">
      <div class="kanban-card-title" data-id="${p.id}">${chat}${warn}${escapeHtml(p.projectName || '')}</div>
      <div class="kanban-card-customer">${escapeHtml(p.customerName || '')}</div>
      <div class="kanban-card-footer">
        ${statusChipHTML(p.status, p.id)}
      </div>
    </div>
  `;
}

function wireRowActions(el) {
  // Wire project-name buttons → open drawer
  el.querySelectorAll('.projectNameBtn').forEach(btn => {
    btn.addEventListener('click', () => openDrawer(btn.dataset.id));
  });
  el.querySelectorAll('.editBtn').forEach(btn => {
    btn.addEventListener('click', () => { window.location.href = `project-edit.html?project=${btn.dataset.id}`; });
  });
  el.querySelectorAll('.calcBtn').forEach(btn => {
    btn.addEventListener('click', () => { window.location.href = `index.html?project=${btn.dataset.id}#results`; });
  });
  el.querySelectorAll('.status-chip.editable').forEach(chip => {
    chip.addEventListener('click', (e) => { e.stopPropagation(); openStatusPopover(chip); });
  });
  el.querySelectorAll('.deleteBtn').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('Project verwijderen? Het wordt soft-deleted en blijft herstelbaar via "Toon verwijderde".')) return;
      try { await softDeleteProject(btn.dataset.id); await refreshProjectList(); }
      catch (err) { alert('Kon niet verwijderen: ' + (err && err.message ? err.message : err)); }
    });
  });
  el.querySelectorAll('.restoreBtn').forEach(btn => {
    btn.addEventListener('click', async () => {
      try { await restoreProject(btn.dataset.id); await refreshProjectList(); }
      catch (err) { alert('Kon niet herstellen: ' + (err && err.message ? err.message : err)); }
    });
  });
  el.querySelectorAll('.permdelBtn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id   = btn.dataset.id;
      const name = btn.dataset.name || '(project)';
      if (!confirm(`Definitief verwijderen van '${name}'?\n\nAlle gegevens, opmerkingen en foto's worden permanent gewist. Dit kan niet ongedaan worden.`)) return;
      try {
        btn.disabled = true;
        await hardDeleteProject(id);
        await refreshProjectList();
      } catch (err) {
        alert('Definitief verwijderen mislukt: ' + (err && err.message ? err.message : err));
        btn.disabled = false;
      }
    });
  });
}

function wireBoard(el) {
  // Name-click → drawer
  el.querySelectorAll('.kanban-card-title').forEach(t => {
    t.addEventListener('click', () => openDrawer(t.dataset.id));
  });
  // Status-chip popover (within card)
  el.querySelectorAll('.status-chip.editable').forEach(chip => {
    chip.addEventListener('click', (e) => { e.stopPropagation(); openStatusPopover(chip); });
  });

  // Drag & drop: cards draggable, columns are drop targets.
  el.querySelectorAll('.kanban-card').forEach(card => {
    card.addEventListener('dragstart', e => {
      e.dataTransfer.setData('text/plain', card.dataset.id);
      e.dataTransfer.effectAllowed = 'move';
      card.classList.add('dragging');
    });
    card.addEventListener('dragend', () => card.classList.remove('dragging'));
  });
  el.querySelectorAll('.kanban-col').forEach(col => {
    col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('drag-over'); });
    col.addEventListener('dragleave', e => {
      // Only clear highlight when leaving the column entirely.
      if (!col.contains(e.relatedTarget)) col.classList.remove('drag-over');
    });
    col.addEventListener('drop', async e => {
      e.preventDefault();
      col.classList.remove('drag-over');
      const id       = e.dataTransfer.getData('text/plain');
      const phaseKey = col.dataset.phase;
      if (!id || !phaseKey) return;
      const phase = PROJECT_PHASES.find(p => p.key === phaseKey);
      if (!phase) return;
      // No-op if already in this phase.
      const proj = _projectsCache.active.find(p => p.id === id);
      if (proj && phaseForStatus(proj.status).key === phaseKey) return;
      try {
        await updateProjectStatus(id, phase.statuses[0]);
        await refreshProjectList();
      } catch (err) {
        alert('Status wijzigen mislukt: ' + (err && err.message ? err.message : err));
      }
    });
  });
}

// ─── DRAWER ──────────────────────────────────────────────────────────────────
let _drawerProjectId = null;

function fmtRelTime(ts) {
  if (!ts || typeof ts.toDate !== 'function') return '—';
  const date = ts.toDate();
  const diffSec = Math.max(0, Math.floor((Date.now() - date.getTime()) / 1000));
  if (diffSec < 60)     return 'net nu';
  if (diffSec < 3600)   return Math.floor(diffSec / 60) + ' min geleden';
  const sameDay = date.toDateString() === new Date().toDateString();
  if (sameDay) return 'vandaag ' + date.toLocaleTimeString('nl-BE', { hour: '2-digit', minute: '2-digit' });
  const yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
  if (date.toDateString() === yesterday.toDateString()) {
    return 'gisteren ' + date.toLocaleTimeString('nl-BE', { hour: '2-digit', minute: '2-digit' });
  }
  return date.toLocaleDateString('nl-BE', { day: '2-digit', month: 'short' }) +
         ' ' + date.toLocaleTimeString('nl-BE', { hour: '2-digit', minute: '2-digit' });
}

function openModal(modalId) {
  const el = document.getElementById(modalId);
  if (!el) return;
  el.classList.add('open');
  el.setAttribute('aria-hidden', 'false');
  document.addEventListener('keydown', _modalEscHandler);
}
function closeModal(modalId) {
  const el = document.getElementById(modalId);
  if (!el) return;
  el.classList.remove('open');
  el.setAttribute('aria-hidden', 'true');
  document.removeEventListener('keydown', _modalEscHandler);
}
function _modalEscHandler(e) {
  if (e.key === 'Escape') {
    document.querySelectorAll('.modal-overlay.open').forEach(m => closeModal(m.id));
  }
}

async function openDrawer(projectId) {
  _drawerProjectId = projectId;
  const drawer  = document.getElementById('drawer');
  const overlay = document.getElementById('drawerOverlay');
  const body    = document.getElementById('drawerBody');
  const header  = document.getElementById('drawerHeader');

  body.innerHTML   = '<p class="empty-state">⏳ Laden…</p>';
  header.innerHTML = '<div class="meta"><h2>…</h2></div><button type="button" class="drawer-close-btn" aria-label="Sluit">×</button>';
  header.querySelector('.drawer-close-btn').addEventListener('click', closeDrawer);

  drawer.classList.add('open');
  overlay.classList.add('open');
  drawer.setAttribute('aria-hidden', 'false');

  try {
    const project = await getProject(projectId);
    if (!project || project.deletedAt) {
      body.innerHTML = '<div class="alert alert-error">Project niet gevonden of verwijderd.</div>';
      return;
    }
    renderDrawer(project);
    // Load comments + photos in parallel.
    const [comments, photos] = await Promise.all([
      listComments(projectId).catch(e => { console.warn('listComments failed', e); return []; }),
      listProjectPhotos(projectId).catch(e => { console.warn('listProjectPhotos failed', e); return []; }),
    ]);
    renderComments(project, comments);
    renderPhotos(project, photos);
    // Mark read (non-blocking). Refresh list so the pulse dot disappears.
    markCommentsRead(projectId).then(() => {
      setTimeout(refreshProjectList, 400);
    }).catch(err => console.warn('markCommentsRead failed', err));
  } catch (e) {
    body.innerHTML = `<div class="alert alert-error">Kon project niet laden: ${escapeHtml(e && e.message ? e.message : String(e))}</div>`;
  }
}

function closeDrawer() {
  const drawer  = document.getElementById('drawer');
  const overlay = document.getElementById('drawerOverlay');
  drawer.classList.remove('open');
  overlay.classList.remove('open');
  drawer.setAttribute('aria-hidden', 'true');
  _drawerProjectId = null;
}

function renderDrawer(project) {
  const header = document.getElementById('drawerHeader');
  const body   = document.getElementById('drawerBody');
  const m      = mergeProjectMetadata(project);

  header.innerHTML = `
    <div class="meta">
      <h2>${escapeHtml(project.projectName || '(zonder naam)')}</h2>
      <div class="customer">${escapeHtml(project.customerName || '')} · ${statusChipHTML(project.status, project.id)}</div>
    </div>
    <button type="button" class="drawer-close-btn" aria-label="Sluit">×</button>
  `;
  header.querySelector('.drawer-close-btn').addEventListener('click', closeDrawer);
  header.querySelectorAll('.status-chip.editable').forEach(chip => {
    chip.addEventListener('click', (e) => { e.stopPropagation(); openStatusPopover(chip); });
  });

  // Build sections conditionally.
  const sections = [];

  // Ground-fault warning banner (top-of-drawer, if applicable)
  if (needsGroundFaultCheck(project)) {
    sections.push(`
      <div class="alert alert-warning" style="margin-bottom:14px;">
        <i class="fa-solid fa-triangle-exclamation icon-warn" aria-hidden="true"></i> <div><strong>Controleer fase↔aarde meting voor Zendure.</strong>
          Nog niet aangevinkt in dit project. Meet het spanningsverschil vóór installatie en vink aan in <i class="fa-solid fa-pen-to-square" aria-hidden="true"></i> Bewerk project om een ground fault te voorkomen.</div>
      </div>
    `);
  }

  // Contact
  const contactLines = [];
  if (m.customer.address) contactLines.push(`<div class="contact-line" style="white-space:pre-wrap;">📍 ${escapeHtml(m.customer.address)}</div>`);
  if (m.customer.phone)   contactLines.push(`<div class="contact-line">📞 <a href="tel:${escapeHtml(m.customer.phone)}">${escapeHtml(m.customer.phone)}</a></div>`);
  if (m.customer.email)   contactLines.push(`<div class="contact-line">✉️ <a href="mailto:${escapeHtml(m.customer.email)}">${escapeHtml(m.customer.email)}</a></div>`);
  if (contactLines.length > 0) {
    sections.push(`<div class="drawer-section"><h3>Contact</h3>${contactLines.join('')}</div>`);
  }

  // Actions
  const calcHref = project.lastCalcRun && project.lastCalcRun.calculatedAt
    ? `index.html?project=${project.id}#results`
    : `index.html?project=${project.id}`;
  sections.push(`
    <div class="drawer-section">
      <div class="drawer-actions">
        <a class="btn" href="${calcHref}"><i class="fa-solid fa-calculator" aria-hidden="true"></i> Open berekening</a>
        <a class="btn btn-secondary" href="project-edit.html?project=${project.id}"><i class="fa-solid fa-pen-to-square" aria-hidden="true"></i> Bewerk project</a>
        <button type="button" class="btn btn-secondary" id="drawerDeleteBtn" style="background:#fde8e8;color:var(--danger);"><i class="fa-solid fa-trash" aria-hidden="true"></i> Verwijderen</button>
      </div>
    </div>
  `);

  // Configs summary
  const configs = (project.lastCalcRun && project.lastCalcRun.inputs && project.lastCalcRun.inputs.selectedConfigTypes) || [];
  if (configs.length > 0) {
    sections.push(`
      <div class="drawer-section">
        <h3>Gekozen configuraties</h3>
        <ul class="configs-summary">${configs.map(c => `<li>${escapeHtml(c)}</li>`).join('')}</ul>
      </div>
    `);
  }

  // Situation
  if (m.situation) {
    sections.push(`<div class="drawer-section"><h3>Situatie</h3><div class="free-text">${escapeHtml(m.situation)}</div></div>`);
  }
  // Notes
  if (m.notes) {
    sections.push(`<div class="drawer-section"><h3>Notities</h3><div class="free-text">${escapeHtml(m.notes)}</div></div>`);
  }

  // Photos placeholder (filled by renderPhotos after async listProjectPhotos)
  sections.push(`
    <div class="drawer-section" id="drawerPhotosSection">
      <h3><i class="fa-solid fa-images" aria-hidden="true"></i> Foto's <span id="drawerPhotosCount" style="font-weight:400;color:var(--muted);"></span></h3>
      <div class="photo-grid" id="drawerPhotoGrid"><p class="empty-state">⏳ Laden…</p></div>
      <div class="photo-uploader">
        <input type="file" id="drawerPhotoInput" accept="image/*" multiple />
        <button type="button" class="btn btn-secondary" id="drawerPhotoUploadBtn" style="font-size:0.85rem;padding:6px 10px;">📤 Upload</button>
      </div>
      <div class="err" id="drawerPhotoErr" style="color:var(--danger);font-size:0.82rem;margin-top:4px;"></div>
    </div>
  `);

  // Comments placeholder (filled by renderComments)
  sections.push(`
    <div class="drawer-section" id="drawerCommentsSection">
      <h3><i class="fa-solid fa-comments" aria-hidden="true"></i> Opmerkingen <span id="drawerCommentsCount" style="font-weight:400;color:var(--muted);"></span></h3>
      <div class="comments-list" id="drawerCommentsList"><p class="empty-state">⏳ Laden…</p></div>
      <div class="composer">
        <textarea id="drawerCommentInput" placeholder="Plaats een opmerking…" maxlength="4000"></textarea>
        <div class="composer-row">
          <div class="err" id="drawerCommentErr"></div>
          <button type="button" class="btn" id="drawerCommentSubmit">Plaats opmerking</button>
        </div>
      </div>
    </div>
  `);

  body.innerHTML = sections.join('');

  // Wire delete button (soft-delete from drawer)
  const delBtn = document.getElementById('drawerDeleteBtn');
  if (delBtn) {
    delBtn.addEventListener('click', async () => {
      if (!confirm('Project verwijderen? Het wordt soft-deleted en blijft herstelbaar via "Toon verwijderde".')) return;
      try {
        await softDeleteProject(project.id);
        closeDrawer();
        await refreshProjectList();
      } catch (err) {
        alert('Verwijderen mislukt: ' + (err && err.message ? err.message : err));
      }
    });
  }

  // Wire photo upload
  document.getElementById('drawerPhotoUploadBtn').addEventListener('click', async () => {
    const input = document.getElementById('drawerPhotoInput');
    const errEl = document.getElementById('drawerPhotoErr');
    errEl.textContent = '';
    const files = Array.from(input.files || []);
    if (!files.length) { errEl.textContent = 'Kies eerst een foto.'; return; }
    const btn = document.getElementById('drawerPhotoUploadBtn');
    btn.disabled = true; btn.textContent = 'Uploaden…';
    try {
      for (const f of files) {
        try { await uploadProjectPhoto(project.id, f); }
        catch (e) { errEl.textContent = e && e.message ? e.message : String(e); break; }
      }
      input.value = '';
      const fresh = await listProjectPhotos(project.id);
      renderPhotos(project, fresh);
    } finally {
      btn.disabled = false; btn.textContent = '📤 Upload';
    }
  });

  // Wire comment submit
  document.getElementById('drawerCommentSubmit').addEventListener('click', async () => {
    const errEl = document.getElementById('drawerCommentErr');
    const btn   = document.getElementById('drawerCommentSubmit');
    const input = document.getElementById('drawerCommentInput');
    errEl.textContent = '';
    const text = input.value;
    if (!text.trim()) { errEl.textContent = 'Leeg.'; return; }
    btn.disabled = true; btn.textContent = 'Bezig…';
    try {
      await addComment(project.id, text);
      input.value = '';
      // Refresh comments list
      const fresh = await listComments(project.id);
      renderComments(project, fresh);
    } catch (e) {
      errEl.textContent = e && e.message ? e.message : String(e);
    } finally {
      btn.disabled = false; btn.textContent = 'Plaats opmerking';
    }
  });
}

function renderComments(project, comments) {
  const list = document.getElementById('drawerCommentsList');
  const count = document.getElementById('drawerCommentsCount');
  if (!list) return;
  count.textContent = comments.length > 0 ? `(${comments.length})` : '';
  if (comments.length === 0) {
    list.innerHTML = '<p class="empty-state" style="font-style:italic;color:var(--muted);">Nog geen opmerkingen. Plaats er één hieronder.</p>';
    return;
  }
  list.innerHTML = comments.map(c => `
    <div class="comment">
      <div class="meta">
        <span class="author">${escapeHtml(shortName(c.author))}</span>
        <span>${fmtRelTime(c.createdAt)}</span>
      </div>
      <div class="text">${escapeHtml(c.text || '')}</div>
    </div>
  `).join('');
  // Scroll last comment into view if the newest is below the fold.
  const lastComment = list.lastElementChild;
  if (lastComment) lastComment.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// Photos rendering + lightbox ------------------------------------------------
let _drawerPhotos = [];
let _lightboxIdx  = 0;

function renderPhotos(project, photos) {
  _drawerPhotos = photos || [];
  const grid  = document.getElementById('drawerPhotoGrid');
  const count = document.getElementById('drawerPhotosCount');
  if (!grid) return;
  count.textContent = _drawerPhotos.length > 0 ? `(${_drawerPhotos.length})` : '';
  if (_drawerPhotos.length === 0) {
    grid.innerHTML = '<p class="empty-state" style="font-style:italic;color:var(--muted);">Nog geen foto\u2019s geüpload.</p>';
    return;
  }
  grid.innerHTML = _drawerPhotos.map((p, i) => {
    if (!p.downloadUrl) {
      return `<div class="photo-tile broken" title="${escapeHtml(p.fetchError || 'Kon foto niet laden')}">${escapeHtml(p.name || 'onbekend')}</div>`;
    }
    return `<div class="photo-tile" data-idx="${i}"><img src="${p.downloadUrl}" alt="${escapeHtml(p.name || '')}" /></div>`;
  }).join('');
  grid.querySelectorAll('.photo-tile[data-idx]').forEach(tile => {
    tile.addEventListener('click', () => openLightbox(parseInt(tile.dataset.idx, 10)));
  });
}

function openLightbox(idx) {
  _lightboxIdx = idx;
  let lb = document.getElementById('dashLightbox');
  if (!lb) {
    lb = document.createElement('div');
    lb.id = 'dashLightbox';
    lb.className = 'lightbox-dash';
    lb.innerHTML = `
      <button type="button" class="lightbox-dash-btn close" title="Sluit">×</button>
      <button type="button" class="lightbox-dash-btn prev" title="Vorige">‹</button>
      <button type="button" class="lightbox-dash-btn next" title="Volgende">›</button>
      <button type="button" class="lightbox-dash-btn del" title="Verwijder foto"><i class="fa-solid fa-trash" aria-hidden="true"></i></button>
      <img id="dashLightboxImg" alt="" />
    `;
    document.body.appendChild(lb);
    lb.querySelector('.close').addEventListener('click', closeLightbox);
    lb.querySelector('.prev').addEventListener('click', e => { e.stopPropagation(); navLightbox(-1); });
    lb.querySelector('.next').addEventListener('click', e => { e.stopPropagation(); navLightbox(+1); });
    lb.querySelector('.del').addEventListener('click', async e => {
      e.stopPropagation();
      const photo = _drawerPhotos[_lightboxIdx];
      if (!photo) return;
      if (!confirm('Deze foto verwijderen?')) return;
      try {
        await deleteProjectPhoto(_drawerProjectId, photo.id, photo.storagePath);
        const fresh = await listProjectPhotos(_drawerProjectId);
        renderPhotos(null, fresh);
        if (fresh.length === 0) closeLightbox();
        else { _lightboxIdx = Math.min(_lightboxIdx, fresh.length - 1); refreshLightboxImage(); }
      } catch (err) {
        alert('Verwijderen mislukt: ' + (err && err.message ? err.message : err));
      }
    });
    lb.addEventListener('click', e => { if (e.target === lb) closeLightbox(); });
    document.addEventListener('keydown', e => {
      if (!lb.classList.contains('open')) return;
      if (e.key === 'Escape') closeLightbox();
      else if (e.key === 'ArrowLeft')  navLightbox(-1);
      else if (e.key === 'ArrowRight') navLightbox(+1);
    });
  }
  refreshLightboxImage();
  lb.classList.add('open');
}

function refreshLightboxImage() {
  const img = document.getElementById('dashLightboxImg');
  const photo = _drawerPhotos[_lightboxIdx];
  if (img && photo && photo.downloadUrl) img.src = photo.downloadUrl;
}

function navLightbox(delta) {
  if (!_drawerPhotos.length) return;
  _lightboxIdx = (_lightboxIdx + delta + _drawerPhotos.length) % _drawerPhotos.length;
  refreshLightboxImage();
}

function closeLightbox() {
  const lb = document.getElementById('dashLightbox');
  if (lb) lb.classList.remove('open');
}

// Drawer close hooks
document.addEventListener('DOMContentLoaded', () => {
  const overlay = document.getElementById('drawerOverlay');
  if (overlay) overlay.addEventListener('click', closeDrawer);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && _drawerProjectId) closeDrawer();
  });
});

// Modal close bindings (generic — works for any modal-overlay)
(function bindModalCloseActions() {
  const modal = document.getElementById('offerteModal');
  if (!modal) return;
  // click-outside
  modal.addEventListener('click', (e) => {
    if (e.target.id === 'offerteModal') closeModal('offerteModal');
  });
  const closeBtn  = document.getElementById('offerteModalClose');
  const cancelBtn = document.getElementById('offerteModalCancel');
  if (closeBtn)  closeBtn.addEventListener('click',  () => closeModal('offerteModal'));
  if (cancelBtn) cancelBtn.addEventListener('click', () => closeModal('offerteModal'));
})();
</script>
