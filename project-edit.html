<!DOCTYPE html>
<html lang="nl-BE">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" integrity="sha512-jnSuA4Ss2PkkikSOLtYs8BlYIeeIK1h99ty4YfvRPAlzr377vr3CXDb7sb7eEEBYjDtcYj+AjBH3FLv5uSJuXg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="assets/css/smartpeak.css" />
  <title>SmartPeak — Project bewerken</title>

  <!-- Firebase compat SDK (same versions as dashboard.html) -->
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-storage-compat.js"></script>

  <script src="assets/js/csv.js"></script>
  <script src="assets/js/firebase-init.js"></script>

  <style>
    /* Page-specific rules only. Globals live in assets/css/smartpeak.css. */
  </style>
</head>
<body>

<!-- State 1: not logged in -->
<div class="card mx-auto mt-5 hide" id="stateLoggedOut" style="max-width:480px">
  <div class="card-body text-center p-4">
    <h1 class="h4 mb-2"><i class="fa-solid fa-bolt text-primary"></i> SmartPeak — Project bewerken</h1>
    <p class="text-muted mb-3">Alleen voor Bloxit medewerkers.</p>
    <button type="button" class="btn btn-primary" id="btnSignIn">Log in met Google</button>
    <p id="signInError" class="alert alert-danger mt-3 hide"></p>
  </div>
</div>

<!-- State 2: logged in but not whitelisted -->
<div class="card mx-auto mt-5 hide" id="stateNotWhitelisted" style="max-width:480px">
  <div class="card-body text-center p-4">
    <h1 class="h4 mb-2"><i class="fa-solid fa-triangle-exclamation icon-danger"></i> Geen toegang</h1>
    <p class="text-muted mb-3">Je bent ingelogd als <strong id="notWhitelistedEmail">…</strong> maar dit account heeft geen toegang tot SmartPeak Projecten.</p>
    <button type="button" class="btn btn-outline-secondary" id="btnSignOutNW">Uitloggen</button>
  </div>
</div>

<!-- State 3: logged in + whitelisted -->
<div class="hide" id="stateAuthorized">
  <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1" id="pageTitle"><i class="fa-solid fa-bolt text-primary"></i> Nieuw project</span>
      <div class="ms-auto">
        <a href="dashboard.html" class="btn btn-sm btn-outline-secondary">
          <i class="fa-solid fa-arrow-left me-1"></i> Dashboard
        </a>
      </div>
    </div>
  </nav>

  <main class="container-fluid py-3 pb-5">
    <div class="row g-3" id="peCardGrid">
      <div class="col-12" id="blokA-slot"></div>
      <div class="col-12 col-lg-6" id="blokB-slot"></div>
      <div class="col-12 col-lg-6" id="blokC-slot"></div>
      <div class="col-12" id="blokD-slot"></div>
    </div>
    <div id="globalError" class="alert alert-danger mt-3 hide"></div>
  </main>

  <nav class="navbar fixed-bottom bg-white border-top shadow-sm">
    <div class="container-fluid justify-content-end gap-2 flex-wrap">
      <button type="button" class="btn btn-outline-secondary flex-grow-1 flex-md-grow-0" id="btnCancel">Annuleren</button>
      <button type="button" class="btn btn-primary flex-grow-1 flex-md-grow-0" id="btnSave">Opslaan</button>
      <button type="button" class="btn btn-success flex-grow-1 flex-md-grow-0" id="btnSaveAndCalc">
        <i class="fa-solid fa-calculator me-1"></i> Opslaan &amp; Bereken
      </button>
    </div>
  </nav>
</div>

<!-- Lightbox -->
<div class="sp-lightbox" id="peLightbox" role="dialog" aria-modal="true" aria-label="Foto vergroten">
  <button type="button" class="sp-lightbox-btn close" id="peLightboxClose" aria-label="Sluiten">×</button>
  <button type="button" class="sp-lightbox-btn prev"  id="peLightboxPrev"  aria-label="Vorige foto">◀</button>
  <img id="peLightboxImg" src="" alt="" />
  <button type="button" class="sp-lightbox-btn next"  id="peLightboxNext"  aria-label="Volgende foto">▶</button>
  <button type="button" class="sp-lightbox-btn del"   id="peLightboxDel"   aria-label="Verwijder foto"><i class="fa-solid fa-trash" aria-hidden="true"></i></button>
  <div class="counter" id="peLightboxCounter">1 / 1</div>
</div>

<!-- Toast container -->
<div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer" style="z-index:1090"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js" integrity="sha512-7Pi/otdlbbCR+LnW+F7PwFcSDJOuUJB3OxtEHbg4vSMvzvJjde4Po1v4BR9Gdc9aXNUNFVUY+SK51wWT8WF0Gg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
// ─── STATE ───────────────────────────────────────────────────────────────────
const URL_PARAMS = new URLSearchParams(window.location.search);
const IS_NEW     = URL_PARAMS.has('new');
const PROJECT_ID = IS_NEW ? null : URL_PARAMS.get('project');

// Current working project state (metadata + basisgegevens). Populated on load.
let _project = null;

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function showState(which) {
  ['stateLoggedOut', 'stateNotWhitelisted', 'stateAuthorized'].forEach(id => {
    document.getElementById(id).classList.toggle('hide', id !== which);
  });
}

function showError(msg) {
  const el = document.getElementById('globalError');
  el.textContent = msg;
  el.classList.remove('hide');
}
function clearError() { document.getElementById('globalError').classList.add('hide'); }

function showToast(message, variant = 'primary') {
  const container = document.getElementById('toastContainer');
  const id = 't_' + Date.now();
  const html = `
    <div id="${id}" class="toast text-bg-${variant} border-0" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body">${escapeHtml(message)}</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Sluiten"></button>
      </div>
    </div>
  `;
  container.insertAdjacentHTML('beforeend', html);
  const el = document.getElementById(id);
  const t = bootstrap.Toast.getOrCreateInstance(el, { delay: 4000 });
  el.addEventListener('hidden.bs.toast', () => el.remove());
  t.show();
}

function showFieldError(fieldId, msg) {
  const el = document.getElementById(fieldId);
  if (!el) return;
  el.classList.add('is-invalid');
  const fb = el.parentElement.querySelector('.invalid-feedback');
  if (fb) fb.textContent = msg;
}
function clearFieldError(fieldId) {
  const el = document.getElementById(fieldId);
  if (!el) return;
  el.classList.remove('is-invalid');
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

// ─── ENTRY POINT ─────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('btnSignIn').addEventListener('click', async () => {
    const errEl = document.getElementById('signInError');
    errEl.classList.add('hide');
    try { await signInWithGoogle(); }
    catch (e) {
      errEl.textContent = 'Aanmelden mislukt: ' + (e && e.message ? e.message : e);
      errEl.classList.remove('hide');
    }
  });
  document.getElementById('btnSignOutNW').addEventListener('click', () => signOut());
  document.getElementById('btnCancel').addEventListener('click', () => { window.location.href = 'dashboard.html'; });

  onAuthStateChanged(async user => {
    if (!user) { showState('stateLoggedOut'); return; }
    if (!isWhitelisted(user)) {
      document.getElementById('notWhitelistedEmail').textContent = user.email || '(onbekend)';
      showState('stateNotWhitelisted');
      return;
    }
    showState('stateAuthorized');
    try { await bootstrap(); }
    catch (e) { showError('Laden mislukt: ' + (e && e.message ? e.message : e)); }
  });
});

async function bootstrap() {
  if (IS_NEW) {
    _project = {
      projectName: '',
      customerName: '',
      status: DEFAULT_STATUS,
      ...newEmptyProjectMetadata(),
      csvUpload: null,
    };
    document.getElementById('pageTitle').innerHTML = '<i class="fa-solid fa-bolt text-primary" aria-hidden="true"></i> Nieuw project';
  } else {
    if (!PROJECT_ID) { showError('Geen project-id opgegeven.'); return; }
    const proj = await getProject(PROJECT_ID);
    if (!proj || proj.deletedAt) { showError('Project niet gevonden of verwijderd.'); return; }
    _project = {
      ...proj,
      ...mergeProjectMetadata(proj),
    };
    document.getElementById('pageTitle').innerHTML = '<i class="fa-solid fa-pen-to-square text-primary" aria-hidden="true"></i> ' + escapeHtml(getProjectLabel(proj));
  }
  renderSections();
  wireActions();
  wireLightbox();
}

function renderSections() {
  // Phase 1: skeleton only. Blok-specific render functions land in Tasks 6-10.
  document.getElementById('blokA-slot').innerHTML = '<div class="card"><div class="card-body">Blok A — Voor de berekening <em class="text-muted">(wordt opgebouwd in Task 6)</em></div></div>';
  document.getElementById('blokB-slot').innerHTML = '<div class="card"><div class="card-body">Blok B — Klant &amp; situatie <em class="text-muted">(Task 7)</em></div></div>';
  document.getElementById('blokC-slot').innerHTML = '<div class="card"><div class="card-body">Blok C — Technische opmeting <em class="text-muted">(Task 8)</em></div></div>';
  document.getElementById('blokD-slot').innerHTML = '<div class="card"><div class="card-body">Blok D — Foto\'s &amp; serienummers <em class="text-muted">(Task 9)</em></div></div>';
}

// Helper — replaces one accordion-item element in place without losing state of others.
// For accordion items the "open" state is controlled by Bootstrap collapse classes.
function rerenderSection(id, renderFn, wireFn) {
  const existing = document.getElementById(id);
  // Check if the collapse panel is currently shown
  const collapseEl = existing ? existing.closest('.accordion-item') : null;
  const collapsePanel = collapseEl ? collapseEl.querySelector('.accordion-collapse') : null;
  const wasShown = collapsePanel ? collapsePanel.classList.contains('show') : true;

  const wrap = document.createElement('div');
  wrap.innerHTML = renderFn();
  const freshItem = wrap.firstElementChild; // the new accordion-item
  // Sync collapse state
  if (!wasShown) {
    const newPanel = freshItem.querySelector('.accordion-collapse');
    const newBtn   = freshItem.querySelector('.accordion-button');
    if (newPanel) { newPanel.classList.remove('show'); }
    if (newBtn)   { newBtn.classList.add('collapsed'); newBtn.setAttribute('aria-expanded', 'false'); }
  }
  if (collapseEl) {
    collapseEl.replaceWith(freshItem);
  } else if (existing) {
    existing.replaceWith(freshItem);
  }
  wireFn();
}

function sectionBasisgegevens() {
  const p = _project;
  const statusOpts = PROJECT_STATUSES.map(s =>
    `<option value="${s.key}" ${s.key === (p.status || DEFAULT_STATUS) ? 'selected' : ''}>${escapeHtml(s.label)}</option>`
  ).join('');
  return `
    <div class="accordion-item">
      <h2 class="accordion-header">
        <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#secBasis" aria-expanded="true" aria-controls="secBasis">
          <i class="fa-solid fa-id-card me-2" aria-hidden="true"></i> Basisgegevens
        </button>
      </h2>
      <div id="secBasis" class="accordion-collapse collapse show">
        <div class="accordion-body">
          <div class="row g-3">
            <div class="col-12 col-md-6">
              <label for="fProjectName" class="form-label">Projectnaam <span class="text-muted small fw-normal">(optioneel)</span></label>
              <input type="text" id="fProjectName" class="form-control" maxlength="120" placeholder="Leeg = klantnaam wordt gebruikt" value="${escapeHtml(p.projectName)}" />
            </div>
            <div class="col-12 col-md-6">
              <label for="fCustomerName" class="form-label">Klantnaam <span class="text-danger">*</span></label>
              <input type="text" id="fCustomerName" class="form-control" maxlength="120" value="${escapeHtml(p.customerName)}" />
              <div class="invalid-feedback">Klantnaam is verplicht.</div>
            </div>
            <div class="col-12 col-md-6">
              <label for="fStatus" class="form-label">Status</label>
              <select id="fStatus" class="form-select">${statusOpts}</select>
            </div>
          </div>
        </div>
      </div>
    </div>
  `;
}

function wireSectionBasisgegevens() {
  // Live-update _project on input so other sections reading _project stay in sync.
  document.getElementById('fProjectName').addEventListener('input', e => { _project.projectName = e.target.value; });
  document.getElementById('fCustomerName').addEventListener('input', e => { _project.customerName = e.target.value; });
  document.getElementById('fStatus').addEventListener('change', e => { _project.status = e.target.value; });
}

function sectionCustomer() {
  const c = _project.customer;
  return `
    <div class="accordion-item">
      <h2 class="accordion-header">
        <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#secCustomer" aria-expanded="true" aria-controls="secCustomer">
          <i class="fa-solid fa-user me-2" aria-hidden="true"></i> Klantcontact
        </button>
      </h2>
      <div id="secCustomer" class="accordion-collapse collapse show">
        <div class="accordion-body">
          <div class="row g-3">
            <div class="col-12">
              <label for="fAddress" class="form-label">Adres <span class="text-muted small fw-normal">(optioneel)</span></label>
              <textarea id="fAddress" class="form-control" rows="2" maxlength="400">${escapeHtml(c.address)}</textarea>
              <div class="form-text">Straat + nummer, postcode, stad. Lijnen afbreken indien nodig.</div>
            </div>
            <div class="col-12 col-md-6">
              <label for="fPhone" class="form-label">Telefoon <span class="text-muted small fw-normal">(optioneel)</span></label>
              <input type="tel" inputmode="tel" id="fPhone" class="form-control" maxlength="60" value="${escapeHtml(c.phone)}" />
            </div>
            <div class="col-12 col-md-6">
              <label for="fEmail" class="form-label">E-mail <span class="text-muted small fw-normal">(optioneel)</span></label>
              <input type="email" inputmode="email" id="fEmail" class="form-control" maxlength="200" value="${escapeHtml(c.email)}" />
            </div>
          </div>
        </div>
      </div>
    </div>
  `;
}

function wireSectionCustomer() {
  document.getElementById('fAddress').addEventListener('input', e => {
    _project.customer.address = e.target.value.trim() || null;
  });
  document.getElementById('fPhone').addEventListener('input', e => {
    _project.customer.phone = e.target.value.trim() || null;
  });
  document.getElementById('fEmail').addEventListener('input', e => {
    _project.customer.email = e.target.value.trim() || null;
  });
}

function sectionSituationNotes() {
  return `
    <div class="accordion-item">
      <h2 class="accordion-header">
        <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#secSituation" aria-expanded="true" aria-controls="secSituation">
          <i class="fa-solid fa-clipboard me-2" aria-hidden="true"></i> Situatie &amp; notities
        </button>
      </h2>
      <div id="secSituation" class="accordion-collapse collapse show">
        <div class="accordion-body">
          <div class="row g-3">
            <div class="col-12">
              <label for="fSituation" class="form-label">Situatie</label>
              <textarea id="fSituation" class="form-control" rows="4" maxlength="4000">${escapeHtml(_project.situation)}</textarea>
              <div class="form-text">Vrije beschrijving: context, bestaande apparaten, klantwensen — alles wat handig is voor een collega om te lezen vóór een bezoek.</div>
            </div>
            <div class="col-12">
              <label for="fNotes" class="form-label">Notities</label>
              <textarea id="fNotes" class="form-control" rows="3" maxlength="2000">${escapeHtml(_project.notes)}</textarea>
              <div class="form-text">Korte interne notities voor jezelf.</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  `;
}

function wireSectionSituationNotes() {
  document.getElementById('fSituation').addEventListener('input', e => {
    _project.situation = e.target.value || null;
  });
  document.getElementById('fNotes').addEventListener('input', e => {
    _project.notes = e.target.value || null;
  });
}

function sectionSupplier() {
  const s = _project.supplier;
  const single = s.isSingleTariff === true;
  return `
    <div class="accordion-item">
      <h2 class="accordion-header">
        <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#secSupplier" aria-expanded="true" aria-controls="secSupplier">
          <i class="fa-solid fa-plug-circle-bolt me-2" aria-hidden="true"></i> Leverancier &amp; tarieven
        </button>
      </h2>
      <div id="secSupplier" class="accordion-collapse collapse show">
        <div class="accordion-body">
          <div class="row g-3">
            <div class="col-12 col-md-6">
              <label for="fSupplierName" class="form-label">Naam leverancier <span class="text-muted small fw-normal">(optioneel)</span></label>
              <input type="text" id="fSupplierName" class="form-control" maxlength="120" value="${escapeHtml(s.name)}" />
            </div>
            <div class="col-12 col-md-6 d-flex align-items-end">
              <div class="form-check form-switch">
                <input type="checkbox" class="form-check-input" id="fSingleTariff" ${single ? 'checked' : ''} />
                <label class="form-check-label" for="fSingleTariff">Enkelvoudig tarief (geen dag/nacht onderscheid)</label>
              </div>
            </div>
            <div class="col-12 col-md-6">
              <label for="fPriceDay" class="form-label">${single ? 'Tarief (€ / kWh)' : 'Dagtarief (€ / kWh)'}</label>
              <input type="number" id="fPriceDay" class="form-control" min="0" step="0.001" value="${s.priceDay != null ? s.priceDay : ''}" />
            </div>
            <div class="col-12 col-md-6" id="rowPriceNight" ${single ? 'style="display:none;"' : ''}>
              <label for="fPriceNight" class="form-label">Nachttarief (€ / kWh)</label>
              <input type="number" id="fPriceNight" class="form-control" min="0" step="0.001" value="${s.priceNight != null ? s.priceNight : ''}" />
              <div class="form-text">ma–vr 22:00–07:00, hele weekend.</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  `;
}

function wireSectionSupplier() {
  document.getElementById('fSupplierName').addEventListener('input', e => {
    _project.supplier.name = e.target.value.trim() || null;
  });
  document.getElementById('fSingleTariff').addEventListener('change', e => {
    _project.supplier.isSingleTariff = e.target.checked;
    if (e.target.checked) {
      _project.supplier.priceNight = null;
    }
    rerenderSection('secSupplier', sectionSupplier, wireSectionSupplier);
  });
  document.getElementById('fPriceDay').addEventListener('input', e => {
    const v = parseFloat(e.target.value);
    _project.supplier.priceDay = isNaN(v) ? null : v;
  });
  const pn = document.getElementById('fPriceNight');
  if (pn) pn.addEventListener('input', e => {
    const v = parseFloat(e.target.value);
    _project.supplier.priceNight = isNaN(v) ? null : v;
  });
}

function sectionWoning() {
  const ageVal = _project.site.houseAgeOver10Years;   // null | true | false
  const effective = effectiveBtwFor(_project);         // null | 6 | 21
  const ageDisabled = ageVal !== null;
  const radioId = (v, label) => {
    const checked = (ageVal === v);
    const strV = v === null ? 'unknown' : String(v);
    return `<div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="fHouseAge" value="${strV}" id="fHouseAge_${strV}" ${checked ? 'checked' : ''} /><label class="form-check-label" for="fHouseAge_${strV}">${label}</label></div>`;
  };
  return `
    <div class="accordion-item">
      <h2 class="accordion-header">
        <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#secWoning" aria-expanded="true" aria-controls="secWoning">
          <i class="fa-solid fa-house me-2" aria-hidden="true"></i> Woning
        </button>
      </h2>
      <div id="secWoning" class="accordion-collapse collapse show">
        <div class="accordion-body">
          <div class="row g-3">
            <div class="col-12 col-md-6">
              <label class="form-label">Leeftijd woning</label>
              <div>
                ${radioId(true,  '10 jaar of ouder')}
                ${radioId(false, 'Jonger dan 10 jaar')}
                ${radioId(null,  'Onbekend')}
              </div>
              <div class="form-text">10 jaar of ouder → BTW 6%. Jonger → BTW 21%.</div>
            </div>
            <div class="col-12 col-md-6">
              <label for="fBtwManual" class="form-label">Effectief BTW-tarief</label>
              <select id="fBtwManual" class="form-select" ${ageDisabled ? 'disabled' : ''}>
                <option value="">— Nog niet bepaald —</option>
                <option value="6"  ${effective === 6  ? 'selected' : ''}>6%</option>
                <option value="21" ${effective === 21 ? 'selected' : ''}>21%</option>
              </select>
              <div class="form-text">${ageDisabled
                ? 'Afgeleid uit de leeftijd van de woning. Kies "Onbekend" om zelf te kiezen.'
                : 'Vul in als de leeftijd onbekend is.'}
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  `;
}

function wireSectionWoning() {
  document.querySelectorAll('input[name="fHouseAge"]').forEach(r => {
    r.addEventListener('change', e => {
      const v = e.target.value;
      _project.site.houseAgeOver10Years =
        v === 'true'  ? true  :
        v === 'false' ? false :
                        null;
      // When auto-derived, we clear the manual btw so readers always see the derived value.
      if (_project.site.houseAgeOver10Years !== null) {
        _project.calcDefaults.btw = null;
      }
      rerenderSection('secWoning', sectionWoning, wireSectionWoning);
    });
  });
  const sel = document.getElementById('fBtwManual');
  sel.addEventListener('change', e => {
    const v = e.target.value;
    _project.calcDefaults.btw = v === '' ? null : Number(v);
  });
}

function sectionElectrical() {
  const e = _project.electrical;
  const opts = ['', ...CONNECTION_TYPES].map(t =>
    `<option value="${t}" ${t === (e.connectionType || '') ? 'selected' : ''}>${t === '' ? '— Niet bepaald —' : t}</option>`
  ).join('');
  return `

// Tri-state radio helper: returns HTML for three labels (Ja/Nee/Onbekend).
// `name` is unique in the DOM; `value` is the current stored state (null|true|false).
function triStateHtml(name, value) {
  const mk = (v, label) => {
    const match = (v === null ? value === null : value === v);
    const strV = v === null ? 'unknown' : String(v);
    const fid = `${name}_${strV}`;
    return `<div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="${name}" value="${strV}" id="${fid}" ${match ? 'checked' : ''} /><label class="form-check-label" for="${fid}">${label}</label></div>`;
  };
  return `
    <div>
      ${mk(true,  'Ja')}
      ${mk(false, 'Nee')}
      ${mk(null,  'Onbekend')}
    </div>
  `;
}

function parseTriState(strVal) {
  if (strVal === 'true')  return true;
  if (strVal === 'false') return false;
  return null;
}

// Photos section — Firestore-backed list with upload + lightbox. Only functional when !IS_NEW

let _photos = [];

function sectionPhotos() {

          <div class="sp-drop-zone" id="peDropZone">

            <div id="peDropPrompt">
              <i class="fa-solid fa-cloud-arrow-up me-1" aria-hidden="true"></i>
              <strong>Sleep foto's hierheen</strong> <span class="text-muted">of klik om te selecteren</span>
              <div class="text-muted small mt-1">Meerdere tegelijk is OK (max 15 MB per foto).</div>
            </div>
            <div class="d-none" id="peDropProgress">
              <div class="progress mt-1" style="height:6px;">
                <div class="progress-bar" role="progressbar" style="width:0%" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
              </div>
              <div class="text-muted small mt-1">Uploaden <span id="peUploadCount">0/0</span>…</div>
            </div>
          </div>
          <div id="pePhotoErr" class="alert alert-danger mt-2 d-none"></div>
        </div>
      </div>
    </div>
  `;

function wireSectionPhotos() {
  if (IS_NEW) return;
  // Async load + render
  listProjectPhotos(PROJECT_ID).then(photos => { _photos = photos; renderPhotoGrid(); })
    .catch(e => {
      const grid = document.getElementById('pePhotoGrid');
      if (grid) grid.innerHTML = `<p class="text-danger small">Kon foto's niet laden: ${escapeHtml(e && e.message ? e.message : String(e))}</p>`;
    });

  const zone  = document.getElementById('peDropZone');
  const input = document.getElementById('pePhotoInput');
  if (!zone || !input) return;

  // Click zone → file picker (but not when the click bubbled from an input already).
  zone.addEventListener('click', (e) => {
    if (e.target === input) return;
    if (zone.classList.contains('uploading')) return;
    input.click();
  });
  input.addEventListener('change', () => {
    const files = Array.from(input.files || []);
    input.value = '';  // reset so picking the same file again re-triggers change
    if (files.length) runPeUpload(files);
  });

  zone.addEventListener('dragover', e => {
    e.preventDefault();
    if (!zone.classList.contains('uploading')) zone.classList.add('drag-over');
  });
  zone.addEventListener('dragleave', e => {
    if (!zone.contains(e.relatedTarget)) zone.classList.remove('drag-over');
  });
  zone.addEventListener('drop', e => {
    e.preventDefault();
    zone.classList.remove('drag-over');
    if (zone.classList.contains('uploading')) return;
    const files = Array.from(e.dataTransfer.files || []).filter(f => f.type.startsWith('image/'));
    if (files.length) runPeUpload(files);
  });
}

async function runPeUpload(files) {
  const zone     = document.getElementById('peDropZone');
  const promptEl = document.getElementById('peDropPrompt');
  const progEl   = document.getElementById('peDropProgress');
  const countEl  = document.getElementById('peUploadCount');
  const errEl    = document.getElementById('pePhotoErr');
  errEl.classList.add('d-none'); errEl.textContent = '';
  promptEl.classList.add('hide');
  progEl.classList.remove('d-none');
  zone.classList.add('uploading');
  countEl.textContent = `0/${files.length}`;
  const bar = progEl.querySelector('.progress-bar');
  bar.style.width = '0%'; bar.setAttribute('aria-valuenow', '0');
  let done = 0;
  let failMsg = null;
  for (const f of files) {
    try {
      await uploadProjectPhoto(PROJECT_ID, f);
      done++;
      countEl.textContent = `${done}/${files.length}`;
      const pct = Math.round((done / files.length) * 100);
      bar.style.width = pct + '%'; bar.setAttribute('aria-valuenow', String(pct));
    } catch (e) {
      failMsg = e && e.message ? e.message : String(e);
      break;
    }
  }
  if (failMsg) {
    errEl.textContent = `Fout na ${done}/${files.length}: ${failMsg}`;
    errEl.classList.remove('d-none');
  }
  try { _photos = await listProjectPhotos(PROJECT_ID); renderPhotoGrid(); } catch {}
  progEl.classList.add('d-none');
  promptEl.classList.remove('hide');
  zone.classList.remove('uploading');
}

function renderPhotoGrid() {
  const grid = document.getElementById('pePhotoGrid');
  const count = document.getElementById('pePhotosCount');
  if (!grid) return;
  if (count) count.textContent = _photos.length > 0 ? `(${_photos.length})` : '';
  if (_photos.length === 0) {
    grid.innerHTML = '<p class="sp-empty-state">Nog geen foto’s geüpload.</p>';
    return;
  }
  grid.innerHTML = _photos.map((p, i) => {
    if (!p.downloadUrl) {
      return `<div class="photo-tile broken" title="${escapeHtml(p.fetchError || 'Kon foto niet laden')}">${escapeHtml(p.name || 'onbekend')}</div>`;
    }
    return `<div class="photo-tile" data-idx="${i}"><img src="${p.downloadUrl}" alt="${escapeHtml(p.name || '')}" /></div>`;
  }).join('');
  grid.querySelectorAll('.photo-tile[data-idx]').forEach(tile => {
    tile.addEventListener('click', () => openPeLightbox(parseInt(tile.dataset.idx, 10)));
  });
}

function wireLightbox() {
  const lb     = document.getElementById('peLightbox');
  const closeBtn = document.getElementById('peLightboxClose');
  const prevBtn  = document.getElementById('peLightboxPrev');
  const nextBtn  = document.getElementById('peLightboxNext');
  const delBtn   = document.getElementById('peLightboxDel');

  closeBtn.addEventListener('click', () => lb.classList.remove('open'));
  prevBtn.addEventListener('click', e => { e.stopPropagation(); navPeLightbox(-1); });
  nextBtn.addEventListener('click', e => { e.stopPropagation(); navPeLightbox(+1); });
  delBtn.addEventListener('click', async e => {
    e.stopPropagation();
    const photo = _photos[_photoLightboxIdx];
    if (!photo) return;
    if (!confirm('Deze foto verwijderen?')) return;
    try {
      await deleteProjectPhoto(PROJECT_ID, photo.id, photo.storagePath);
      _photos = await listProjectPhotos(PROJECT_ID);
      renderPhotoGrid();
      if (_photos.length === 0) lb.classList.remove('open');
      else { _photoLightboxIdx = Math.min(_photoLightboxIdx, _photos.length - 1); refreshPeLightboxImage(); }
    } catch (err) {
      showToast('Verwijderen mislukt: ' + (err && err.message ? err.message : err), 'danger');
    }
  });
  lb.addEventListener('click', e => { if (e.target === lb) lb.classList.remove('open'); });
  document.addEventListener('keydown', e => {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') lb.classList.remove('open');
    else if (e.key === 'ArrowLeft')  navPeLightbox(-1);
    else if (e.key === 'ArrowRight') navPeLightbox(+1);
  });
}

function openPeLightbox(idx) {
  _photoLightboxIdx = idx;
  refreshPeLightboxImage();
  document.getElementById('peLightbox').classList.add('open');
}
function refreshPeLightboxImage() {
  const img = document.getElementById('peLightboxImg');
  const counter = document.getElementById('peLightboxCounter');
  const photo = _photos[_photoLightboxIdx];
  if (img && photo && photo.downloadUrl) img.src = photo.downloadUrl;
  if (counter) counter.textContent = `${_photoLightboxIdx + 1} / ${_photos.length}`;
}
function navPeLightbox(delta) {
  if (!_photos.length) return;
  _photoLightboxIdx = (_photoLightboxIdx + delta + _photos.length) % _photos.length;
  refreshPeLightboxImage();
}

  `;
}

function shortEmail(e) { return e ? String(e).split('@')[0] : '—'; }
function formatTs(ts) {
  if (!ts || typeof ts.toDate !== 'function') return '—';
  return ts.toDate().toLocaleString('nl-BE', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
}

function wireSectionCsv() {
  document.getElementById('fCsv').addEventListener('change', async e => {
    const file = e.target.files[0];
    if (!file) return;
    const errEl = document.getElementById('csvErr');
    errEl.classList.add('hide');
    try {
      const text = await file.text();
      const csvData = extractCsvForStorage(text);
      if (IS_NEW) {
        _pendingCsv = csvData;
      } else {
        await setProjectCsv(PROJECT_ID, csvData);
        const proj = await getProject(PROJECT_ID);
        _project.csvUpload = proj.csvUpload;
        showToast('CSV opgeslagen', 'success');
      }
      rerenderSection('secCsv', sectionCsv, wireSectionCsv);
    } catch (err) {
      errEl.textContent = err && err.message ? err.message : String(err);
      errEl.classList.remove('hide');
    }
  });
}

function wireActions() {
  document.getElementById('btnSave').addEventListener('click', () => save({ andCalc: false }));
  document.getElementById('btnSaveAndCalc').addEventListener('click', () => save({ andCalc: true }));
}

// Gather the save payload from _project. Extracted so later sections all just
// mutate _project on input and the save flow reads the full object uniformly.
function collectFromForm() {
  // Basisgegevens
  const projectName  = (_project.projectName  || '').trim();
  const customerName = (_project.customerName || '').trim();

  const errors = {};  // { fieldId-or-key: { msg, invId? } }
  if (!customerName) errors.fCustomerName = { msg: 'Klantnaam is verplicht.' };

  // Inverter-verplichting (ingevuld in Task 7): elk inverter-kaartje moet powerKw > 0 hebben.
  for (let i = 0; i < _project.solar.inverters.length; i++) {
    const inv = _project.solar.inverters[i];
    if (!(Number(inv.powerKw) > 0)) {
      errors[`inv_powerKw_${inv.id}`] = {
        msg: `Omvormer ${i + 1}: vermogen (kW) is verplicht als de omvormer in de lijst staat.`,
        invId: inv.id,
      };
    }
  }

  if (Object.keys(errors).length > 0) {
    const err = new Error('Sommige velden zijn verplicht of ongeldig.');
    err.fieldErrors = errors;
    throw err;
  }

  const metadata = {
    customer:     _project.customer,
    situation:    _project.situation,
    notes:        _project.notes,
    site:         _project.site,
    electrical:   _project.electrical,
    cabinet:      _project.cabinet,
    solar:        _project.solar,
    supplier:     _project.supplier,
    calcDefaults: _project.calcDefaults,
  };
  return { projectName, customerName, status: _project.status || DEFAULT_STATUS, metadata };
}

async function save({ andCalc }) {
  // Clear previous field-level errors before each attempt
  ['fProjectName', 'fCustomerName'].forEach(clearFieldError);
  // Clear any inverter powerKw errors
  document.querySelectorAll('[data-inv-field="powerKw"].is-invalid').forEach(el => {
    el.classList.remove('is-invalid');
  });
  clearError();
  const btnSave = document.getElementById('btnSave');
  const btnSC   = document.getElementById('btnSaveAndCalc');
  btnSave.disabled = true; btnSC.disabled = true;
  const prevLabel = btnSave.textContent;
  btnSave.textContent = 'Bezig…';
  try {
    const payload = collectFromForm();
    let targetId;
    if (IS_NEW) {
      const ref = await createProject({
        projectName:  payload.projectName,
        customerName: payload.customerName,
        status:       payload.status,
        csvData:      _pendingCsv,
        metadata:     payload.metadata,
      });
      targetId = ref.id;
    } else {
      await updateProjectMetadata(PROJECT_ID, {
        projectName:  payload.projectName,
        customerName: payload.customerName,
        status:       payload.status,
        ...payload.metadata,
      });
      targetId = PROJECT_ID;
    }
    if (andCalc) {
      window.location.href = `index.html?project=${targetId}#results`;
    } else {
      window.location.href = 'dashboard.html';
    }
  } catch (e) {
    if (e.fieldErrors) {
      let firstEl = null;
      for (const [key, { msg, invId }] of Object.entries(e.fieldErrors)) {
        if (invId) {
          // Per-inverter powerKw: highlight via data-attribute selector
          const inputEl = document.querySelector(`[data-inv-field="powerKw"][data-inv-id="${invId}"]`);
          if (inputEl) {
            inputEl.classList.add('is-invalid');
            if (!firstEl) firstEl = inputEl;
          }
        } else {
          showFieldError(key, msg);
          if (!firstEl) firstEl = document.getElementById(key);
        }
      }
      if (firstEl) firstEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    showError(e && e.message ? e.message : String(e));
    btnSave.disabled = false; btnSC.disabled = false;
    btnSave.textContent = prevLabel;
  }
}
</script>
