<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartPeak — Productspecs</title>
  <style>
    :root {
      --primary: #2c7be5;
      --primary-dark: #1a5fba;
      --success: #00b478;
      --warning: #f6a623;
      --danger: #e54545;
      --bg: #f0f4fb;
      --card: #ffffff;
      --border: #dce3f0;
      --text: #1e2a3a;
      --muted: #6b7a99;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 16px;
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 700;
      color: var(--primary-dark);
      margin-bottom: 4px;
    }
    h2 {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--primary-dark);
      margin: 0;
    }
    .subtitle { color: var(--muted); font-size: 0.95rem; margin-bottom: 12px; }
    .back-link {
      display: inline-block;
      font-size: 0.88rem;
      color: var(--primary);
      text-decoration: none;
      margin-bottom: 24px;
    }
    .back-link:hover { text-decoration: underline; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(44, 123, 229, 0.06);
    }

    .alert {
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 0.92rem;
      margin-bottom: 16px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .alert-warning { background: #fff8ec; border: 1px solid #f6a623; color: #7a5000; }
    .alert-info    { background: #eef4ff; border: 1px solid #2c7be5; color: #1a3a6e; }

    .config-banner {
      background: linear-gradient(135deg, #eef4ff 0%, #dbeafe 100%);
      border-color: var(--primary);
      font-size: 1rem;
    }
    .config-banner strong { color: var(--primary-dark); }

    .product-section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(44, 123, 229, 0.06);
    }
    .brand-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .product-description {
      font-style: italic;
      color: var(--muted);
      max-width: 70ch;
      margin-bottom: 14px;
      line-height: 1.5;
    }

    .spec-table-wrap { overflow-x: auto; margin-top: 8px; }
    table.spec-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.93rem;
    }
    table.spec-table th,
    table.spec-table td {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
      text-align: left;
    }
    table.spec-table thead th {
      background: var(--bg);
      color: var(--muted);
      font-weight: 600;
      font-size: 0.85rem;
      white-space: nowrap;
    }
    table.spec-table tr:last-child td { border-bottom: none; }
    table.spec-table td:first-child {
      color: var(--muted);
      width: 28%;
    }
    table.spec-table .col-totaal {
      font-weight: 600;
      color: var(--primary-dark);
    }
    table.spec-table .em-dash {
      color: var(--muted);
    }

    .photo-section h2 { margin-bottom: 6px; }
    .carousel-hint {
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 12px;
    }
    .photo-carousel {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      gap: 12px;
      padding-bottom: 8px;
      scrollbar-width: thin;
    }
    .photo-item {
      flex: 0 0 280px;
      aspect-ratio: 4 / 3;
      scroll-snap-align: start;
      background: var(--bg);
      border: 1px dashed var(--border);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 0.88rem;
      text-align: center;
      padding: 8px;
    }

    .photo-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 8px;
      cursor: zoom-in;
      display: block;
    }
    .photo-item.has-image {
      padding: 0;
      border: 1px solid var(--border);
      background: #000;
      overflow: hidden;
    }

    .calc-footnote {
      margin-top: 24px;
      font-size: 0.88rem;
    }

    /* ─── Lightbox modal ──────────────────────────────────────────────────── */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 24px;
    }
    .lightbox.open { display: flex; }
    .lightbox img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      box-shadow: 0 4px 32px rgba(0, 0, 0, 0.5);
      border-radius: 6px;
    }
    .lightbox-btn {
      position: absolute;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      font-size: 1.6rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
      user-select: none;
    }
    .lightbox-btn:hover { background: rgba(255, 255, 255, 0.25); }
    .lightbox-btn:disabled { opacity: 0; pointer-events: none; }
    .lightbox-close { top: 16px; right: 16px; }
    .lightbox-prev  { left: 16px;  top: 50%; transform: translateY(-50%); }
    .lightbox-next  { right: 16px; top: 50%; transform: translateY(-50%); }
    .lightbox-counter {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.9rem;
      background: rgba(0, 0, 0, 0.4);
      padding: 4px 12px;
      border-radius: 12px;
    }

    @media (max-width: 600px) {
      h1 { font-size: 1.3rem; }
      h2 { font-size: 1.05rem; }
      .photo-item { flex-basis: 80%; }
      .lightbox-btn { width: 40px; height: 40px; font-size: 1.3rem; }
      .lightbox-close { top: 8px; right: 8px; }
      .lightbox-prev  { left: 8px;  }
      .lightbox-next  { right: 8px; }
    }
  </style>
</head>
<body>

<h1>⚡ SmartPeak — Productspecs</h1>
<p class="subtitle">Technische informatie voor uw geselecteerde configuratie.</p>
<a href="index.html" class="back-link">← Terug naar calculator</a>

<main id="content"></main>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Foto vergroten">
  <button type="button" class="lightbox-btn lightbox-close" id="lightboxClose" aria-label="Sluiten">×</button>
  <button type="button" class="lightbox-btn lightbox-prev"  id="lightboxPrev"  aria-label="Vorige foto">◀</button>
  <img id="lightboxImg" src="" alt="" />
  <button type="button" class="lightbox-btn lightbox-next"  id="lightboxNext"  aria-label="Volgende foto">▶</button>
  <div class="lightbox-counter" id="lightboxCounter">1 / 1</div>
</div>

<script>
// ─── PRODUCT SPECS (manufacturer-canonical, hard-coded) ─────────────────────
const MARSTEK_PER_UNIT = {
  capacityNominal: 5.12,   // kWh
  inverterPower:   2.5,    // kW
  weight:          60,     // kg
};
const ZENDURE_PER_INVERTER = {
  acPower:    2.4,         // kW
  peakKw:     3.6,         // kW
  loadW:      2400,        // W
  dischargeW: 2600,        // W
  weight:     10.12,       // kg
};
const ZENDURE_PER_BATTERY = {
  capacityNominal: 2.88,   // kWh
  weight:          26.1,   // kg
};

// ─── PHOTOS ─────────────────────────────────────────────────────────────────
const MARSTEK_PHOTOS = [
  'assets/products/marstek/marstek-1.jpg',
  'assets/products/marstek/marstek-2.jpg',
  'assets/products/marstek/marstek-3.jpg',
  'assets/products/marstek/marstek-4.jpg',
  'assets/products/marstek/marstek-5.jpg',
  'assets/products/marstek/marstek-6.jpg',
];
const ZENDURE_PHOTOS = [
  'assets/products/zendure/zendure-1.webp',
  'assets/products/zendure/zendure-2.webp',
  'assets/products/zendure/zendure-3.webp',
  'assets/products/zendure/zendure-4.webp',
  'assets/products/zendure/zendure-5.webp',
];

// ─── FORMATTING HELPERS ─────────────────────────────────────────────────────
function fmtKwh(n) {
  return n.toLocaleString('nl-BE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtKw(n) {
  return n.toLocaleString('nl-BE', { minimumFractionDigits: 1, maximumFractionDigits: 2 });
}
function fmtKg(n) {
  return n.toLocaleString('nl-BE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

const DASH = '<span class="em-dash">—</span>';

// ─── SHARED PIECES ──────────────────────────────────────────────────────────
function renderCarousel(images) {
  const items = (images && images.length > 0)
    ? images.map((src, i) => `<div class="photo-item has-image"><img src="${src}" alt="Productfoto ${i + 1}" data-photo-idx="${i}" /></div>`).join('')
    : Array.from({ length: 6 }, (_, i) => `<div class="photo-item">Foto ${i + 1} — volgt</div>`).join('');
  const hint = (images && images.length > 0)
    ? "Sleep horizontaal door de foto's. Klik op een foto om te vergroten."
    : "Sleep horizontaal door de foto's.";
  return `
    <section class="card photo-section">
      <h2>📷 Foto's</h2>
      <p class="carousel-hint">${hint}</p>
      <div class="photo-carousel" id="photoCarousel">
        ${items}
      </div>
    </section>
  `;
}

// ─── LIGHTBOX ───────────────────────────────────────────────────────────────
let _lightboxImages = [];
let _lightboxIdx = 0;

function _openLightbox(images, idx) {
  _lightboxImages = images;
  _lightboxIdx = idx;
  _renderLightbox();
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function _closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
}

function _lightboxStep(delta) {
  const next = _lightboxIdx + delta;
  if (next < 0 || next >= _lightboxImages.length) return;
  _lightboxIdx = next;
  _renderLightbox();
}

function _renderLightbox() {
  const total = _lightboxImages.length;
  document.getElementById('lightboxImg').src = _lightboxImages[_lightboxIdx];
  document.getElementById('lightboxImg').alt = `Productfoto ${_lightboxIdx + 1} van ${total}`;
  document.getElementById('lightboxPrev').disabled = _lightboxIdx <= 0;
  document.getElementById('lightboxNext').disabled = _lightboxIdx >= total - 1;
  document.getElementById('lightboxCounter').textContent = `${_lightboxIdx + 1} / ${total}`;
}

function _wireLightboxOnce() {
  const lb = document.getElementById('lightbox');
  document.getElementById('lightboxClose').addEventListener('click', _closeLightbox);
  document.getElementById('lightboxPrev' ).addEventListener('click', () => _lightboxStep(-1));
  document.getElementById('lightboxNext' ).addEventListener('click', () => _lightboxStep(+1));
  // Backdrop click closes (but not when clicking the image itself).
  lb.addEventListener('click', (e) => { if (e.target === lb) _closeLightbox(); });
  // Keyboard: Esc/←/→
  document.addEventListener('keydown', (e) => {
    if (!lb.classList.contains('open')) return;
    if      (e.key === 'Escape')     _closeLightbox();
    else if (e.key === 'ArrowLeft')  _lightboxStep(-1);
    else if (e.key === 'ArrowRight') _lightboxStep(+1);
  });
}

function _wireCarouselClicks(images) {
  if (!images || images.length === 0) return;
  const carousel = document.getElementById('photoCarousel');
  if (!carousel) return;
  carousel.querySelectorAll('img[data-photo-idx]').forEach(img => {
    img.addEventListener('click', () => {
      const idx = parseInt(img.dataset.photoIdx, 10);
      _openLightbox(images, idx);
    });
  });
}

function renderFootnote() {
  return `
    <div class="alert alert-info calc-footnote">
      ℹ️ <div>Onze ROI-calculator rekent met conservatievere waarden om realistische besparing te tonen — fabrikantswaarden zijn theoretische maxima en houden geen rekening met dagelijkse ontlaadbeperkingen, performantieverlies over de jaren, of niet-100%-bruikbare capaciteit.</div>
    </div>
  `;
}

// ─── RENDERERS ──────────────────────────────────────────────────────────────
function renderMarstek(numUnits) {
  const totalCap      = numUnits * MARSTEK_PER_UNIT.capacityNominal;
  const totalInverter = numUnits * MARSTEK_PER_UNIT.inverterPower;
  const totalWeight   = numUnits * MARSTEK_PER_UNIT.weight;
  return `
    <div class="card config-banner">
      🔋 Uw configuratie: <strong>${numUnits} × Marstek Venus E V3</strong>
    </div>
    <section class="product-section">
      <div class="brand-header"><h2>Marstek Venus E V3</h2></div>
      <p class="product-description">
        Plug-and-play AC-thuisbatterij met geïntegreerde bidirectionele omvormer.
        Modulair uitbreidbaar, eenvoudige installatie, native WiFi en RS485.
      </p>
      <div class="spec-table-wrap">
        <table class="spec-table spec-2col">
          <thead>
            <tr><th>Spec</th><th>Configuratie totaal</th><th>Per unit</th></tr>
          </thead>
          <tbody>
            <tr><td>Capaciteit</td><td class="col-totaal">${fmtKwh(totalCap)} kWh nominaal</td><td>5,12 kWh nominaal (4,608 kWh bij 90% DoD)</td></tr>
            <tr><td>AC-vermogen (omv. integrated)</td><td class="col-totaal">${fmtKw(totalInverter)} kW</td><td>2,5 kW bidirectioneel</td></tr>
            <tr><td>Chemie</td><td class="col-totaal">${DASH}</td><td>LFP (LiFePO4)</td></tr>
            <tr><td>Spanning</td><td class="col-totaal">${DASH}</td><td>51,2 V</td></tr>
            <tr><td>Cyclussen</td><td class="col-totaal">${DASH}</td><td>&gt; 6.000 (90% DoD)</td></tr>
            <tr><td>Beschermingsklasse</td><td class="col-totaal">${DASH}</td><td>IP65</td></tr>
            <tr><td>Werktemperatuur</td><td class="col-totaal">${DASH}</td><td>−20 °C tot +60 °C</td></tr>
            <tr><td>Afmetingen (per unit)</td><td class="col-totaal">${DASH}</td><td>480 × 624 × 153 mm</td></tr>
            <tr><td>Gewicht (per unit)</td><td class="col-totaal">${DASH}</td><td>60 kg</td></tr>
            <tr><td>Totaal gewicht</td><td class="col-totaal">${fmtKg(totalWeight)} kg</td><td>${DASH}</td></tr>
            <tr><td>Connectiviteit</td><td class="col-totaal">${DASH}</td><td>WiFi · RS485</td></tr>
          </tbody>
        </table>
      </div>
    </section>
    ${renderCarousel(MARSTEK_PHOTOS)}
    ${renderFootnote()}
  `;
}

function renderZendure(numInverters, numBatteriesPerInverter) {
  const totalBatteries  = numInverters * numBatteriesPerInverter;
  const totalAcPower    = numInverters * ZENDURE_PER_INVERTER.acPower;
  const totalPeakKw     = numInverters * ZENDURE_PER_INVERTER.peakKw;
  const totalLoadW      = numInverters * ZENDURE_PER_INVERTER.loadW;
  const totalDischargeW = numInverters * ZENDURE_PER_INVERTER.dischargeW;
  const totalCapacity   = totalBatteries * ZENDURE_PER_BATTERY.capacityNominal;
  const totalWeight     = numInverters * ZENDURE_PER_INVERTER.weight + totalBatteries * ZENDURE_PER_BATTERY.weight;
  return `
    <div class="card config-banner">
      🔋 Uw configuratie: <strong>${numInverters} × Solarflow 2400 AC + ${numBatteriesPerInverter} batterijmodules per omvormer = ${totalBatteries} batterijmodules totaal</strong>
    </div>
    <section class="product-section">
      <div class="brand-header"><h2>Zendure SolarFlow 2400 AC + AB3000X</h2></div>
      <p class="product-description">
        Modulair systeem met aparte AC-omvormer (SolarFlow 2400 AC) en stapelbare LiFePO4-batterijmodules (AB3000X).
        Tot 6 modules per omvormer; meerdere omvormers parallel schakelbaar voor hogere vermogens.
        Plug-and-play uitbreiding van bestaande zonne-installaties.
      </p>
      <div class="spec-table-wrap">
        <table class="spec-table spec-3col">
          <thead>
            <tr><th>Spec</th><th>Configuratie totaal</th><th>Per omvormer (Solarflow 2400 AC)</th><th>Per batterijmodule (AB3000X)</th></tr>
          </thead>
          <tbody>
            <tr><td>Capaciteit</td><td class="col-totaal">${fmtKwh(totalCapacity)} kWh nominaal</td><td>${DASH}</td><td>2,88 kWh (nominaal)</td></tr>
            <tr><td>AC-vermogen</td><td class="col-totaal">${fmtKw(totalAcPower)} kW (piek ${fmtKw(totalPeakKw)} kW / 10 s)</td><td>2.400 W (piek 3.600 W / 10 s)</td><td>${DASH}</td></tr>
            <tr><td>Laadvermogen</td><td class="col-totaal">${totalLoadW} W</td><td>2.400 W</td><td>${DASH}</td></tr>
            <tr><td>Ontlaadvermogen</td><td class="col-totaal">${totalDischargeW} W</td><td>2.600 W</td><td>${DASH}</td></tr>
            <tr><td>Spanning</td><td class="col-totaal">${DASH}</td><td>230 V / 50 Hz</td><td>48 V</td></tr>
            <tr><td>Chemie</td><td class="col-totaal">${DASH}</td><td>${DASH}</td><td>LiFePO4</td></tr>
            <tr><td>Efficiëntie</td><td class="col-totaal">${DASH}</td><td>93%</td><td>${DASH}</td></tr>
            <tr><td>Beschermingsklasse</td><td class="col-totaal">${DASH}</td><td>IP65</td><td>IP65</td></tr>
            <tr><td>Afmetingen (per stuk)</td><td class="col-totaal">${DASH}</td><td>410 × 302 × 75 mm</td><td>477,5 × 320 × 194 mm</td></tr>
            <tr><td>Gewicht (per stuk)</td><td class="col-totaal">${DASH}</td><td>10,12 kg</td><td>26,1 kg</td></tr>
            <tr><td>Totaal gewicht</td><td class="col-totaal">${fmtKg(totalWeight)} kg</td><td>${DASH}</td><td>${DASH}</td></tr>
          </tbody>
        </table>
      </div>
    </section>
    ${renderCarousel(ZENDURE_PHOTOS)}
    ${renderFootnote()}
  `;
}

function renderFallback() {
  return `
    <div class="alert alert-warning">
      ⚠️ <div>Geen geldige configuratie geselecteerd. <a href="index.html">Ga terug naar de calculator</a> en klik op een 📖 Productspecs-knop bij een gekozen configuratie.</div>
    </div>
  `;
}

// ─── ENTRY POINT ────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(window.location.search);
  const type = params.get('type') || '';
  let html;
  let images = null;
  let m;
  if ((m = type.match(/^MARVE03_X(\d+)$/))) {
    html = renderMarstek(parseInt(m[1], 10));
    images = MARSTEK_PHOTOS;
  } else if ((m = type.match(/^ZSF2400AC_(\d+)X(\d+)$/))) {
    html = renderZendure(parseInt(m[1], 10), parseInt(m[2], 10));
    images = ZENDURE_PHOTOS;
  } else {
    html = renderFallback();
  }
  document.getElementById('content').innerHTML = html;
  _wireLightboxOnce();
  _wireCarouselClicks(images);
});
</script>

</body>
</html>
