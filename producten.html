<main class="container py-4" id="content"></main>

<div class="sp-lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Foto vergroten">
  <button type="button" class="sp-lightbox-btn close" id="lightboxClose" aria-label="Sluiten">×</button>
  <button type="button" class="sp-lightbox-btn prev"  id="lightboxPrev"  aria-label="Vorige foto">◀</button>
  <img id="lightboxImg" src="" alt="" />
  <button type="button" class="sp-lightbox-btn next"  id="lightboxNext"  aria-label="Volgende foto">▶</button>
  <div class="counter" id="lightboxCounter">1 / 1</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js" integrity="sha512-7Pi/otdlbbCR+LnW+F7PwFcSDJOuUJB3OxtEHbg4vSMvzvJjde4Po1v4BR9Gdc9aXNUNFVUY+SK51wWT8WF0Gg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
// ─── PRODUCT SPECS (manufacturer-canonical, hard-coded) ─────────────────────
const MARSTEK_PER_UNIT = {
  capacityNominal: 5.12,   // kWh
  inverterPower:   2.5,    // kW
  weight:          60,     // kg
};
const ZENDURE_PER_INVERTER = {
  acPower:    2.4,         // kW
  peakKw:     3.6,         // kW
  loadW:      2400,        // W
  dischargeW: 2600,        // W
  weight:     10.12,       // kg
};
const ZENDURE_PER_BATTERY = {
  capacityNominal: 2.88,   // kWh
  weight:          26.1,   // kg
};

// ─── ZENDURE SOLARFLOW 2400 AC+ (new model with built-in battery) ───────────
const ZENDURE_ACPLUS_HUB = {
  builtInCapacity: 2.4,    // kWh (internal LiFePO4, 50 Ah @ 48 V)
  acPower:    2.4,         // kW (Premium) / 0.8 kW standaard
  maxAcInput: 3.2,         // kW
  chargeW:    2400,        // W
  dischargeW: 2400,        // W
  weight:     27.8,        // kg
};
const ZENDURE_ACPLUS_BATTERY = {
  capacityNominal: 2.88,   // kWh (AB3000L)
  weight:          26.3,   // kg
};

// ─── PHOTOS ─────────────────────────────────────────────────────────────────
const MARSTEK_PHOTOS = [
  'assets/products/marstek/marstek-1.jpg',
  'assets/products/marstek/marstek-2.jpg',
  'assets/products/marstek/marstek-3.jpg',
  'assets/products/marstek/marstek-4.jpg',
  'assets/products/marstek/marstek-5.jpg',
  'assets/products/marstek/marstek-6.jpg',
];
const ZENDURE_PHOTOS = [
  'assets/products/zendure/zendure-1.webp',
  'assets/products/zendure/zendure-2.webp',
  'assets/products/zendure/zendure-3.webp',
  'assets/products/zendure/zendure-4.webp',
  'assets/products/zendure/zendure-5.webp',
];
const ZENDURE_ACPLUS_PHOTOS = [
  'assets/products/zendure-ac-plus/zendure-acplus-1.png',
  'assets/products/zendure-ac-plus/zendure-acplus-2.jpg',
  'assets/products/zendure-ac-plus/zendure-acplus-3.jpg',
  'assets/products/zendure-ac-plus/zendure-acplus-4.jpg',
  'assets/products/zendure-ac-plus/zendure-acplus-5.jpg',
  'assets/products/zendure-ac-plus/zendure-acplus-6.jpg',
  'assets/products/zendure-ac-plus/zendure-acplus-ab3000l.jpg',
];

// ─── FORMATTING HELPERS ─────────────────────────────────────────────────────
function fmtKwh(n) {
  return n.toLocaleString('nl-BE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtKw(n) {
  return n.toLocaleString('nl-BE', { minimumFractionDigits: 1, maximumFractionDigits: 2 });
}
function fmtKg(n) {
  return n.toLocaleString('nl-BE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

const DASH = '<span class="text-muted">—</span>';

// ─── SHARED PIECES ──────────────────────────────────────────────────────────
let _carouselIdCounter = 0;
function renderCarousel(images) {
  const id = 'prodCarousel' + (++_carouselIdCounter);
  if (!images || images.length === 0) {
    return `
      <section class="card mb-4">
        <div class="card-body">
          <h2 class="h5 mb-3"><i class="fa-solid fa-camera me-2"></i> Foto's</h2>
          <p class="text-muted fst-italic">Foto's volgen.</p>
        </div>
      </section>
    `;
  }
  const indicators = images.map((_, i) => `
    <button type="button" data-bs-target="#${id}" data-bs-slide-to="${i}"
            ${i === 0 ? 'class="active" aria-current="true"' : ''}
            aria-label="Foto ${i + 1}"></button>
  `).join('');
  const slides = images.map((src, i) => `
    <div class="carousel-item ${i === 0 ? 'active' : ''}">
      <img src="${src}" alt="Productfoto ${i + 1}" data-photo-idx="${i}" class="d-block mx-auto" />
    </div>
  `).join('');
  return `
    <section class="card mb-4">
      <div class="card-body">
        <h2 class="h5 mb-3"><i class="fa-solid fa-camera me-2"></i> Foto's</h2>
        <p class="text-muted small">Gebruik de pijltjes of klik op een foto om te vergroten.</p>
        <div id="${id}" class="carousel slide" data-bs-ride="false" data-bs-interval="false">
          <div class="carousel-indicators">${indicators}</div>
          <div class="carousel-inner">${slides}</div>
          <button class="carousel-control-prev" type="button" data-bs-target="#${id}" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Vorige</span>
          </button>
          <button class="carousel-control-next" type="button" data-bs-target="#${id}" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Volgende</span>
          </button>
        </div>
      </div>
    </section>
  `;
}

// ─── LIGHTBOX ───────────────────────────────────────────────────────────────
let _lightboxImages = [];
let _lightboxIdx = 0;

function _openLightbox(images, idx) {
  _lightboxImages = images;
  _lightboxIdx = idx;
  _renderLightbox();
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function _closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
}

function _lightboxStep(delta) {
  const next = _lightboxIdx + delta;
  if (next < 0 || next >= _lightboxImages.length) return;
  _lightboxIdx = next;
  _renderLightbox();
}

function _renderLightbox() {
  const total = _lightboxImages.length;
  document.getElementById('lightboxImg').src = _lightboxImages[_lightboxIdx];
  document.getElementById('lightboxImg').alt = `Productfoto ${_lightboxIdx + 1} van ${total}`;
  document.getElementById('lightboxPrev').disabled = _lightboxIdx <= 0;
  document.getElementById('lightboxNext').disabled = _lightboxIdx >= total - 1;
  document.getElementById('lightboxCounter').textContent = `${_lightboxIdx + 1} / ${total}`;
}

function _wireLightboxOnce() {
  const lb = document.getElementById('lightbox');
  document.getElementById('lightboxClose').addEventListener('click', _closeLightbox);
  document.getElementById('lightboxPrev' ).addEventListener('click', () => _lightboxStep(-1));
  document.getElementById('lightboxNext' ).addEventListener('click', () => _lightboxStep(+1));
  // Backdrop click closes (but not when clicking the image itself).
  lb.addEventListener('click', (e) => { if (e.target === lb) _closeLightbox(); });
  // Keyboard: Esc/←/→
  document.addEventListener('keydown', (e) => {
    if (!lb.classList.contains('open')) return;
    if      (e.key === 'Escape')     _closeLightbox();
    else if (e.key === 'ArrowLeft')  _lightboxStep(-1);
    else if (e.key === 'ArrowRight') _lightboxStep(+1);
  });
}

function _wireCarouselClicks(images) {
  if (!images || images.length === 0) return;
  const content = document.getElementById('content');
  if (!content) return;
  content.querySelectorAll('img[data-photo-idx]').forEach(img => {
    img.addEventListener('click', () => {
      const idx = parseInt(img.dataset.photoIdx, 10);
      _openLightbox(images, idx);
    });
  });
}

function renderFootnote() {
  return `
    <div class="alert alert-info d-flex align-items-center" role="alert">
      <i class="fa-solid fa-circle-info me-2"></i>
      <div>Onze ROI-calculator rekent met conservatievere waarden om realistische besparing te tonen — fabrikantswaarden zijn theoretische maxima en houden geen rekening met dagelijkse ontlaadbeperkingen, performantieverlies over de jaren, of niet-100%-bruikbare capaciteit.</div>
    </div>
  `;
}

// ─── RENDERERS ──────────────────────────────────────────────────────────────
function renderMarstek(numUnits) {
  const totalCap      = numUnits * MARSTEK_PER_UNIT.capacityNominal;
  const totalInverter = numUnits * MARSTEK_PER_UNIT.inverterPower;
  const totalWeight   = numUnits * MARSTEK_PER_UNIT.weight;
  return `
    <div class="alert alert-info d-flex align-items-center" role="alert">
      <i class="fa-solid fa-circle-info me-2"></i>
      <div>Uw configuratie: <strong>${numUnits} × Marstek Venus E V3</strong></div>
    </div>
    <div class="row g-4 mb-4">
      <div class="col-lg-7">
        <section class="card h-100">
          <div class="card-body">
            <h2 class="h5 mb-1">Marstek Venus E V3</h2>
            <p class="text-muted fst-italic mb-3">
              Plug-and-play AC-thuisbatterij met geïntegreerde bidirectionele omvormer.
              Modulair uitbreidbaar, eenvoudige installatie, native WiFi en RS485.
            </p>
            <h3 class="h6 mb-2"><i class="fa-solid fa-list-check me-2"></i> Specificaties</h3>
            <dl class="row mb-0 small">
              <dt class="col-sm-5 col-md-4">Capaciteit</dt><dd class="col-sm-7 col-md-8"><strong>${fmtKwh(totalCap)} kWh nominaal</strong> / per unit: 5,12 kWh nominaal (4,608 kWh bij 90% DoD)</dd>
              <dt class="col-sm-5 col-md-4">AC-vermogen</dt><dd class="col-sm-7 col-md-8"><strong>${fmtKw(totalInverter)} kW</strong> / per unit: 2,5 kW bidirectioneel</dd>
              <dt class="col-sm-5 col-md-4">Chemie</dt><dd class="col-sm-7 col-md-8">LFP (LiFePO4)</dd>
              <dt class="col-sm-5 col-md-4">Spanning</dt><dd class="col-sm-7 col-md-8">51,2 V</dd>
              <dt class="col-sm-5 col-md-4">Cyclussen</dt><dd class="col-sm-7 col-md-8">&gt; 6.000 (90% DoD)</dd>
              <dt class="col-sm-5 col-md-4">Beschermingsklasse</dt><dd class="col-sm-7 col-md-8">IP65</dd>
              <dt class="col-sm-5 col-md-4">Werktemperatuur</dt><dd class="col-sm-7 col-md-8">−20 °C tot +60 °C</dd>
              <dt class="col-sm-5 col-md-4">Afmetingen (per unit)</dt><dd class="col-sm-7 col-md-8">480 × 624 × 153 mm</dd>
              <dt class="col-sm-5 col-md-4">Gewicht (per unit)</dt><dd class="col-sm-7 col-md-8">60 kg</dd>
              <dt class="col-sm-5 col-md-4">Totaal gewicht</dt><dd class="col-sm-7 col-md-8"><strong>${fmtKg(totalWeight)} kg</strong></dd>
              <dt class="col-sm-5 col-md-4">Connectiviteit</dt><dd class="col-sm-7 col-md-8">WiFi · RS485</dd>
            </dl>
          </div>
        </section>
      </div>
      <div class="col-lg-5">
        ${renderCarousel(MARSTEK_PHOTOS)}
      </div>
    </div>
    ${renderFootnote()}
  `;
}

function renderZendure(numInverters, numBatteriesPerInverter) {
  const totalBatteries  = numInverters * numBatteriesPerInverter;
  const totalAcPower    = numInverters * ZENDURE_PER_INVERTER.acPower;
  const totalPeakKw     = numInverters * ZENDURE_PER_INVERTER.peakKw;
  const totalLoadW      = numInverters * ZENDURE_PER_INVERTER.loadW;
  const totalDischargeW = numInverters * ZENDURE_PER_INVERTER.dischargeW;
  const totalCapacity   = totalBatteries * ZENDURE_PER_BATTERY.capacityNominal;
  const totalWeight     = numInverters * ZENDURE_PER_INVERTER.weight + totalBatteries * ZENDURE_PER_BATTERY.weight;
  return `
    <div class="alert alert-info d-flex align-items-center" role="alert">
      <i class="fa-solid fa-circle-info me-2"></i>
      <div>Uw configuratie: <strong>${numInverters} × Solarflow 2400 AC + ${numBatteriesPerInverter} batterijmodules per omvormer = ${totalBatteries} batterijmodules totaal</strong></div>
    </div>
    <div class="row g-4 mb-4">
      <div class="col-lg-7">
        <section class="card h-100">
          <div class="card-body">
            <h2 class="h5 mb-1">Zendure SolarFlow 2400 AC + AB3000X</h2>
            <p class="text-muted fst-italic mb-3">
              Modulair systeem met aparte AC-omvormer (SolarFlow 2400 AC) en stapelbare LiFePO4-batterijmodules (AB3000X).
              Tot 6 modules per omvormer; meerdere omvormers parallel schakelbaar voor hogere vermogens.
              Plug-and-play uitbreiding van bestaande zonne-installaties.
            </p>
            <h3 class="h6 mb-2"><i class="fa-solid fa-list-check me-2"></i> Specificaties</h3>
            <dl class="row mb-0 small">
              <dt class="col-sm-5 col-md-4">Capaciteit</dt><dd class="col-sm-7 col-md-8"><strong>${fmtKwh(totalCapacity)} kWh nominaal</strong> / per module: 2,88 kWh (nominaal)</dd>
              <dt class="col-sm-5 col-md-4">AC-vermogen</dt><dd class="col-sm-7 col-md-8"><strong>${fmtKw(totalAcPower)} kW</strong> (piek ${fmtKw(totalPeakKw)} kW / 10 s) / per omvormer: 2.400 W (piek 3.600 W / 10 s)</dd>
              <dt class="col-sm-5 col-md-4">Laadvermogen</dt><dd class="col-sm-7 col-md-8"><strong>${totalLoadW} W</strong> / per omvormer: 2.400 W</dd>
              <dt class="col-sm-5 col-md-4">Ontlaadvermogen</dt><dd class="col-sm-7 col-md-8"><strong>${totalDischargeW} W</strong> / per omvormer: 2.600 W</dd>
              <dt class="col-sm-5 col-md-4">Spanning</dt><dd class="col-sm-7 col-md-8">Omvormer: 230 V / 50 Hz · Module: 48 V</dd>
              <dt class="col-sm-5 col-md-4">Chemie</dt><dd class="col-sm-7 col-md-8">LiFePO4</dd>
              <dt class="col-sm-5 col-md-4">Efficiëntie</dt><dd class="col-sm-7 col-md-8">93%</dd>
              <dt class="col-sm-5 col-md-4">Beschermingsklasse</dt><dd class="col-sm-7 col-md-8">Omvormer: IP65 · Module: IP65</dd>
              <dt class="col-sm-5 col-md-4">Afmetingen</dt><dd class="col-sm-7 col-md-8">Omvormer: 410 × 302 × 75 mm · Module: 477,5 × 320 × 194 mm</dd>
              <dt class="col-sm-5 col-md-4">Gewicht (per stuk)</dt><dd class="col-sm-7 col-md-8">Omvormer: 10,12 kg · Module: 26,1 kg</dd>
              <dt class="col-sm-5 col-md-4">Totaal gewicht</dt><dd class="col-sm-7 col-md-8"><strong>${fmtKg(totalWeight)} kg</strong></dd>
            </dl>
          </div>
        </section>
      </div>
      <div class="col-lg-5">
        ${renderCarousel(ZENDURE_PHOTOS)}
      </div>
    </div>
    ${renderFootnote()}
  `;
}

function renderZendureAcPlus(numInverters, numBatteriesPerInverter) {
  const totalBatteries    = numInverters * numBatteriesPerInverter;
  const totalAcPower      = numInverters * ZENDURE_ACPLUS_HUB.acPower;
  const totalMaxAcInput   = numInverters * ZENDURE_ACPLUS_HUB.maxAcInput;
  const totalChargeW      = numInverters * ZENDURE_ACPLUS_HUB.chargeW;
  const totalDischargeW   = numInverters * ZENDURE_ACPLUS_HUB.dischargeW;
  const totalCapacity     = numInverters * (ZENDURE_ACPLUS_HUB.builtInCapacity + numBatteriesPerInverter * ZENDURE_ACPLUS_BATTERY.capacityNominal);
  const totalWeight       = numInverters * ZENDURE_ACPLUS_HUB.weight + totalBatteries * ZENDURE_ACPLUS_BATTERY.weight;

  const batLabel = numBatteriesPerInverter === 0
    ? 'geen extra batterijmodules'
    : `${numBatteriesPerInverter} × AB3000L per hub = ${totalBatteries} module${totalBatteries !== 1 ? 's' : ''} totaal`;

  return `
    <div class="alert alert-info d-flex align-items-center" role="alert">
      <i class="fa-solid fa-circle-info me-2"></i>
      <div>Uw configuratie: <strong>${numInverters} × Solarflow 2400 AC+ (${batLabel})</strong></div>
    </div>
    <div class="row g-4 mb-4">
      <div class="col-lg-7">
        <section class="card h-100">
          <div class="card-body">
            <h2 class="h5 mb-1">Zendure SolarFlow 2400 AC+ ${numBatteriesPerInverter > 0 ? '+ AB3000L' : ''}</h2>
            <p class="text-muted fst-italic mb-3">
              Modulair AC-gekoppeld opslagsysteem met ingebouwde 2,4 kWh LiFePO4-batterij in de hub.
              Uitbreidbaar met stapelbare AB3000L-modules (2,88 kWh per stuk, max. 5 per hub).
              Meerdere hubs parallel schakelbaar. Plug-and-play installatie, WiFi- en Bluetooth-connectiviteit.
            </p>
            <h3 class="h6 mb-2"><i class="fa-solid fa-list-check me-2"></i> Specificaties — Hub</h3>
            <dl class="row mb-0 small">
              <dt class="col-sm-5 col-md-4">Model</dt><dd class="col-sm-7 col-md-8">ZDSF2400AC+</dd>
              <dt class="col-sm-5 col-md-4">Ingebouwde batterij</dt><dd class="col-sm-7 col-md-8">2,4 kWh LiFePO4 (50 Ah / 48 V DC) per hub · <strong>${fmtKwh(numInverters * ZENDURE_ACPLUS_HUB.builtInCapacity)} kWh</strong> totaal</dd>
              <dt class="col-sm-5 col-md-4">Nom. AC-uitgangsvermogen</dt><dd class="col-sm-7 col-md-8"><strong>${fmtKw(totalAcPower)} kW</strong> (Premium) / per hub: 800 W standaard · 2.400 W Premium</dd>
              <dt class="col-sm-5 col-md-4">Max. AC-ingangsvermogen</dt><dd class="col-sm-7 col-md-8"><strong>${fmtKw(totalMaxAcInput)} kW</strong> / per hub: 3.200 W</dd>
              <dt class="col-sm-5 col-md-4">Max. laad-/ontlaadvermogen</dt><dd class="col-sm-7 col-md-8"><strong>${totalChargeW.toLocaleString('nl-BE')} W</strong> / per hub: 2.400 W (50 A DC)</dd>
              <dt class="col-sm-5 col-md-4">Spanning</dt><dd class="col-sm-7 col-md-8">230 V AC / 50 Hz · Batterijpoort: 37,5–54,75 V DC</dd>
              <dt class="col-sm-5 col-md-4">Arbeidsfactor</dt><dd class="col-sm-7 col-md-8">0,8 inductief tot 0,8 capacitief</dd>
              <dt class="col-sm-5 col-md-4">Beschermingsklasse</dt><dd class="col-sm-7 col-md-8">IP65 · Klasse I</dd>
              <dt class="col-sm-5 col-md-4">Afmetingen (hub)</dt><dd class="col-sm-7 col-md-8">326 × 294 × 251 mm (B × H × D)</dd>
              <dt class="col-sm-5 col-md-4">Gewicht (hub)</dt><dd class="col-sm-7 col-md-8">27,8 kg</dd>
              <dt class="col-sm-5 col-md-4">Bedrijfstemperatuur</dt><dd class="col-sm-7 col-md-8">−20 °C tot +55 °C</dd>
              <dt class="col-sm-5 col-md-4">Laadtemperatuur (batterij)</dt><dd class="col-sm-7 col-md-8">0 °C tot +55 °C</dd>
              <dt class="col-sm-5 col-md-4">Ontlaadtemperatuur (batterij)</dt><dd class="col-sm-7 col-md-8">−20 °C tot +55 °C</dd>
              <dt class="col-sm-5 col-md-4">Connectiviteit</dt><dd class="col-sm-7 col-md-8">WiFi 4 (802.11 b/g/n) · Bluetooth 5.0</dd>
            </dl>
            ${numBatteriesPerInverter > 0 ? `
            <hr class="my-3" />
            <h3 class="h6 mb-2"><i class="fa-solid fa-battery-full me-2"></i> Specificaties — AB3000L module</h3>
            <dl class="row mb-0 small">
              <dt class="col-sm-5 col-md-4">Model</dt><dd class="col-sm-7 col-md-8">ZDAB3000L</dd>
              <dt class="col-sm-5 col-md-4">Capaciteit (modules)</dt><dd class="col-sm-7 col-md-8"><strong>${fmtKwh(totalBatteries * ZENDURE_ACPLUS_BATTERY.capacityNominal)} kWh</strong> / per module: 60 Ah / 2.880 Wh</dd>
              <dt class="col-sm-5 col-md-4">Chemie</dt><dd class="col-sm-7 col-md-8">LiFePO₄</dd>
              <dt class="col-sm-5 col-md-4">Spanning</dt><dd class="col-sm-7 col-md-8">48 V DC</dd>
              <dt class="col-sm-5 col-md-4">Max. in-/uitgangsvermogen</dt><dd class="col-sm-7 col-md-8">1 module: 1.680 W · 2+ modules: 1.920 W</dd>
              <dt class="col-sm-5 col-md-4">Beschermingsklasse</dt><dd class="col-sm-7 col-md-8">IP65</dd>
              <dt class="col-sm-5 col-md-4">Afmetingen (module)</dt><dd class="col-sm-7 col-md-8">394 × 257 × 283 mm</dd>
              <dt class="col-sm-5 col-md-4">Gewicht (module)</dt><dd class="col-sm-7 col-md-8">26,3 kg</dd>
              <dt class="col-sm-5 col-md-4">Laadtemperatuur</dt><dd class="col-sm-7 col-md-8">0 °C tot +55 °C</dd>
              <dt class="col-sm-5 col-md-4">Ontlaadtemperatuur</dt><dd class="col-sm-7 col-md-8">−20 °C tot +60 °C</dd>
              <dt class="col-sm-5 col-md-4">Zelfverwarmingsfunctie</dt><dd class="col-sm-7 col-md-8">Ja, automatisch bij −20 °C tot 0 °C</dd>
              <dt class="col-sm-5 col-md-4">Brandbeveiliging</dt><dd class="col-sm-7 col-md-8">Aerosol brandblusssysteem (activatie bij 170 °C ±10 °C)</dd>
              <dt class="col-sm-5 col-md-4">Batterijbeveiliging</dt><dd class="col-sm-7 col-md-8">Overbelasting, overstroom, kortsluiting, oververhitting</dd>
              <dt class="col-sm-5 col-md-4">Cyclussen</dt><dd class="col-sm-7 col-md-8">6.000</dd>
              <dt class="col-sm-5 col-md-4">Compatibiliteit</dt><dd class="col-sm-7 col-md-8">SolarFlow 2400 Pro / SolarFlow 2400 AC+</dd>
            </dl>
            ` : ''}
            <hr class="my-3" />
            <h3 class="h6 mb-2"><i class="fa-solid fa-calculator me-2"></i> Totalen configuratie</h3>
            <dl class="row mb-0 small">
              <dt class="col-sm-5 col-md-4">Totale capaciteit</dt><dd class="col-sm-7 col-md-8"><strong>${fmtKwh(totalCapacity)} kWh</strong></dd>
              <dt class="col-sm-5 col-md-4">Totaal AC-vermogen</dt><dd class="col-sm-7 col-md-8"><strong>${fmtKw(totalAcPower)} kW</strong></dd>
              <dt class="col-sm-5 col-md-4">Totaal gewicht</dt><dd class="col-sm-7 col-md-8"><strong>${fmtKg(totalWeight)} kg</strong></dd>
            </dl>
          </div>
        </section>
      </div>
      <div class="col-lg-5">
        ${renderCarousel(ZENDURE_ACPLUS_PHOTOS)}
      </div>
    </div>
    ${renderFootnote()}
  `;
}

function renderFallback() {
  return `
    <div class="alert alert-warning d-flex align-items-center" role="alert">
      <i class="fa-solid fa-triangle-exclamation me-2"></i>
      <div>Geen geldige configuratie geselecteerd. <a href="index.html">Ga terug naar de calculator</a> en klik op een <i class="fa-solid fa-book-open"></i> Productspecs-knop bij een gekozen configuratie.</div>
    </div>
  `;
}

// ─── ENTRY POINT ────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(window.location.search);
  const type = params.get('type') || '';
  let html;
  let images = null;
  let m;
  if ((m = type.match(/^MARVE03_X(\d+)$/))) {
    html = renderMarstek(parseInt(m[1], 10));
    images = MARSTEK_PHOTOS;
  } else if ((m = type.match(/^ZSF2400AC\+_(\d+)X(\d+)$/))) {
    html = renderZendureAcPlus(parseInt(m[1], 10), parseInt(m[2], 10));
    images = ZENDURE_ACPLUS_PHOTOS;
  } else if ((m = type.match(/^ZSF2400AC_(\d+)X(\d+)$/))) {
    html = renderZendure(parseInt(m[1], 10), parseInt(m[2], 10));
    images = ZENDURE_PHOTOS;
  } else {
    html = renderFallback();
  }
  document.getElementById('content').innerHTML = html;
  _wireLightboxOnce();
  _wireCarouselClicks(images);
});
</script>

</body>
</html>
